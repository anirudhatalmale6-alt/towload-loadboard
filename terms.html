<style>
:root{
  --ink:#0b1220; --ink-2:#3d4a5c; --ink-3:#6b7a90;
  --line:#e4e9f0; --wash:#f6f8fb; --accent:#f97316;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  background:#fff;color:var(--ink);line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
.top{
  border-bottom:1px solid var(--line);padding:16px 22px;
  display:flex;align-items:center;gap:14px;
  position:sticky;top:0;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);z-index:10;
}
.top a.brand{font-weight:800;font-size:17px;letter-spacing:-.4px;color:var(--ink);text-decoration:none}
.top .sp{flex:1}
.top button{
  background:var(--wash);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;
  font-family:inherit;
}
.tabs{
  display:flex;gap:4px;padding:16px 22px 0;max-width:800px;margin:0 auto;
  overflow-x:auto;
}
.tabs a{
  padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:700;
  color:var(--ink-3);text-decoration:none;white-space:nowrap;
}
.tabs a.on{background:var(--ink);color:#fff}
.wrap{max-width:800px;margin:0 auto;padding:24px 22px 90px}
h1{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.2;margin-bottom:6px}
.meta{color:var(--ink-3);font-size:13px;margin-bottom:30px}
.doc h2{
  font-size:19px;font-weight:750;letter-spacing:-.4px;
  margin:34px 0 12px;padding-top:4px;
}
.doc p{margin-bottom:14px;color:var(--ink-2);font-size:15.5px}
.doc .lead{
  font-size:17px;color:var(--ink);background:var(--wash);
  border-left:3px solid var(--accent);padding:16px 18px;border-radius:0 10px 10px 0;
  margin-bottom:8px;
}
.doc ul{margin:0 0 16px 20px}
.doc li{margin-bottom:9px;color:var(--ink-2);font-size:15.5px}
.doc strong{color:var(--ink);font-weight:700}
.doc .version{
  margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--ink-3);font-size:13px;
}
.loading{color:var(--ink-3);padding:40px 0;text-align:center}
mark.todo{
  background:#fef3c7;color:#92400e;border:1px dashed #d97706;
  border-radius:5px;padding:0 5px;font-size:12.5px;font-weight:750;
  letter-spacing:.4px;
}
@media(max-width:640px){ h1{font-size:25px} .wrap{padding:20px 18px 70px} }
</style>

<body>

<div class="top">
  <a class="brand" href="tow">TowSling</a>
  <div class="sp"></div>
  <button onclick="tlToggle()" id="langBtn">English</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <h1 id="title">…</h1>
  <div class="meta" id="meta"></div>
  <div class="doc" id="body"><div class="loading">…</div></div>
</div>

<script src="i18n.js?v=20260816w"></script>
<script src="presence.js?v=20260816w" defer></script>
<script>
const TABS = [
  ['customer', {es:'Clientes', en:'Customers'}],
  ['tower',    {es:'Compañías de grúas', en:'Towing companies'}],
  ['privacy',  {es:'Privacidad', en:'Privacy'}],
];

function currentDoc(){
  const d = new URLSearchParams(location.search).get('doc') || 'customer';
  return TABS.some(([k]) => k === d) ? d : 'customer';
}

function renderTabs(){
  const cur = currentDoc(), lang = tlLang();
  document.getElementById('tabs').innerHTML = TABS.map(([k, labels]) =>
    `<a href="terms?doc=${k}" class="${k === cur ? 'on' : ''}">${labels[lang] || labels.es}</a>`
  ).join('');
}

async function load(){
  renderTabs();
  const r = await fetch(`api/legal/doc?key=${currentDoc()}&lang=${tlLang()}`)
                  .then(x => x.json()).catch(() => null);

  if(!r || !r.success){
    document.getElementById('body').innerHTML =
      `<div class="loading">${tlLang() === 'es'
        ? 'No pudimos cargar este documento.' : 'We could not load this document.'}</div>`;
    return;
  }

  document.title = r.title;
  document.getElementById('title').textContent = r.title;
  document.getElementById('meta').textContent =
    (tlLang() === 'es' ? 'Versión ' : 'Version ') + r.version + ' · ' +
    (r.effective_at || '').slice(0, 10);

  // Body is our own seeded HTML from legal_documents, not user input.
  // Unfilled placeholders are highlighted rather than hidden — a terms page
  // that quietly ships reading "{{COMPANY_NAME}} operates a platform" is worse
  // than one that makes the gap impossible to miss.
  document.getElementById('body').innerHTML =
    r.body.replace(/\{\{([A-Z_]+)\}\}/g, '<mark class="todo">$1</mark>');
}

// The language toggle has to reload the document, not just swap page chrome —
// the text itself comes from the server in the chosen language.
const _toggle = window.tlToggle;
window.tlToggle = function(){ _toggle(); load(); };

load();
</script>
</body>
</html>
