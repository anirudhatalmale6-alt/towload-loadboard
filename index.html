    <div class="c-side"><div class="pay">
      <div class="amt">${money(b.amount)}</div>
      <div class="net">asking &middot; posted at ${money(b.offer_amount)}</div>
    </div></div></div>`).join('');
}

/* The status in words. The raw value was printed straight out, so a driver
   looking back through his week saw "goa" rather than "Vehicle gone". */
function statusLabel(v){
  const known = ['completed','canceled','expired','goa','awarded','en_route','on_scene','in_progress'];
  if(v === 'goa') return t('o.hist_goa');
  if(known.includes(v)) return t('status.' + v);
  return String(v || '').replace(/_/g, ' ');
}

/* Search fires 350ms after the operator stops typing, not per keystroke. The
   query is a LIKE scan across several columns; somebody typing a plate would
   otherwise kick off eight of them and get the answers back out of order. */
let HIST_TIMER = null;
/* Totals for the WHOLE filtered set, straight from the server.
   Never summed from DATA: the list is capped at 200, so a busy quarter would
   be added up from the first 200 jobs and read as the complete figure. The
   row count is shown next to it so the two can never be confused. */
function renderHistoryTotals(tot, shown){
  const el = document.getElementById('histTotals');
  if(!el) return;
  if(!tot){ el.innerHTML = ''; return; }
  const m = n => '$' + Number(n || 0).toFixed(2);
  const capped = tot.jobs > shown
    ? `<div class="ht-note">${t('o.ht_capped', {shown, total: tot.jobs})}</div>` : '';
  el.innerHTML = `
    <div class="ht">
      <div class="ht-main">
        <div class="ht-label">${esc(t('o.ht_earned'))}</div>
        <div class="ht-big">${m(tot.net)}</div>
        <div class="ht-sub">${m(tot.gross)} ${esc(t('o.ht_billed'))} · ${m(tot.fees)} ${esc(t('o.ht_fee'))}</div>
      </div>
      <div class="ht-stats">
        <div><b>${tot.paid_jobs}</b><span>${esc(t('o.ht_paid'))}</span></div>
        <div><b>${tot.goa_jobs}</b><span>GOA</span></div>
        <div><b>${tot.canceled_jobs}</b><span>${esc(t('status.canceled'))}</span></div>
        <div><b>${tot.jobs}</b><span>${esc(t('o.ht_total'))}</span></div>
      </div>
    </div>${capped}`;
}

function debouncedHistory(){
  clearTimeout(HIST_TIMER);
  HIST_TIMER = setTimeout(load, 350);
}

/* ── where the job actually is ──────────────────────────────────────────
   A customer who taps "use my location" gives coordinates and nothing else —
   no city, no state, no street. The card used to print that straight out as
   "null, null", and the address line said "Your location", which is the label
   from the customer's own screen and no use at all to somebody trying to find
   a car.

   So: show whatever is genuinely known, and if that is only a position, show the
   position. Every one of them is a link into Google Maps, because the next
   thing the driver does is navigate there. */
function placeLabel(c){
  const from = c.pickup_area || [c.pickup_city, c.pickup_state].filter(Boolean).join(', ');
  return from || (hasCoords(c.pickup_lat, c.pickup_lng)
                    ? t('o.pin_at', {coords: coordText(c.pickup_lat, c.pickup_lng)})
                    : t('o.pin_unknown'));
}

function hasCoords(lat, lng){
  return lat !== null && lat !== undefined && lng !== null && lng !== undefined
         && !(Number(lat) === 0 && Number(lng) === 0);
}

function coordText(lat, lng){
  return Number(lat).toFixed(5) + ', ' + Number(lng).toFixed(5);
}

/* What to print on the A line. An address if we have a real one; otherwise the
   coordinates. "Your location" was being STORED as the address by older
   requests, so it is treated as absent rather than shown to a driver. */
function pickupText(c){
  const a = (c.pickup_address || '').trim();
  const junk = !a || /^(your location|su ubicación|null)$/i.test(a);
  if(!junk) return a;
  return hasCoords(c.pickup_lat, c.pickup_lng)
           ? coordText(c.pickup_lat, c.pickup_lng) : '';
}

/* A tappable line that opens Google Maps. Coordinates are used for the link
   whenever we have them — they are exact, where a typed address can be
   ambiguous — with the address as the label. */
function mapsLink(label, lat, lng){
  if(!label) return `<span>${esc(t('o.pin_unknown'))}</span>`;
  const q = hasCoords(lat, lng) ? coordText(lat, lng) : label;
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  return `<a class="maplink" href="${esc(url)}" target="_blank" rel="noopener"
             onclick="event.stopPropagation()">${esc(label)}</a>`;
}

// A tow has one more step than a jump start: the stretch with the car on the
// back. Only tows get it — "Towing" on a lockout would be nonsense, and the
// customer's timeline is built from the same rule.
const towSteps = svc => svc === 'tow'
  ? {awarded:'en_route', en_route:'on_scene', on_scene:'in_progress', in_progress:'complete'}
  : {awarded:'en_route', en_route:'on_scene', on_scene:'complete'};

const nextLabel = (cur, svc) => ({
  en_route: t('o.enroute'), on_scene: t('o.onscene'),
  in_progress: t('o.towing'), complete: t('o.complete'),
}[towSteps(svc)[cur]] || t('o.complete'));

/* ── job photos ────────────────────────────────────────────────────────
   The evidence a damage claim is answered with. Three weeks after a tow a
   customer says the bumper was not like that, and without photographs that is
   one person's word against another's — which the towing company loses by
   default, and Ricardo behind them.

   The checklist comes from the SERVER (photo_state), never from counting here.
   A tick drawn by the browser that disagreed with what the server has stored
   would be the worst possible outcome: a driver who believes he is covered
   and is not. */
function photoPanel(c){
  const ps = c.photo_state;
  const pickup  = ps.items.filter(i => i.stage === 'pickup');
  const dropoff = ps.items.filter(i => i.stage === 'dropoff');

  const row = i => `
    <label class="pshot ${i.done ? 'on' : ''}">
      <input type="file" accept="image/*" capture="environment" hidden
             onchange="uploadPhoto(${c.id}, '${i.key}', this)">
      <span class="pmark">${i.done ? '&#10003;' : '&#43;'}</span>
      <span class="ptxt">
        <b>${esc(i.label)}</b>
        <small>${i.done ? t('o.ph_taken') : esc(i.hint)}</small>
      </span>
      ${i.done ? `<img class="pthumb" src="api/calls/photo?id=${i.photo_id}" alt=""
                       loading="lazy" title="${t('o.ph_view')}"
                       onclick="event.preventDefault();event.stopPropagation();
                                openPhoto(${i.photo_id}, '${esc(i.label).replace(/'/g, '&#39;')}')">` : ''}
    </label>`;

  return `
  <details class="photos" data-call="${c.id}" ${OPEN_PHOTOS.has(String(c.id)) ? 'open' : ''}
           ontoggle="rememberPhotos(this)">
    <summary>
      <span>${t('o.ph_title')}</span>
      <span class="pcount ${ps.complete ? 'ok' : 'warn'}">
        ${ps.items.filter(i => i.done).length}/${ps.items.length}
      </span>
    </summary>

    ${!ps.complete ? `<div class="pwarn">${t('o.ph_warn')}</div>` : ''}

    <div class="pgroup">${t('o.ph_before')}</div>
    ${pickup.map(row).join('')}
    <div class="pgroup">${t('o.ph_after')}</div>
    ${dropoff.map(row).join('')}

    <label class="pshot extra">
      <input type="file" accept="image/*" capture="environment" hidden
             onchange="uploadPhoto(${c.id}, 'damage', this)">
      <span class="pmark">&#43;</span>
      <span class="ptxt"><b>${t('o.ph_damage')}</b><small>${t('o.ph_damage_h')}</small></span>
    </label>
    <!-- Only while he is out and could still find nothing there. -->
    ${['en_route','on_scene'].includes(c.status) ? `
    <label class="pshot extra goa">
      <input type="file" accept="image/*" capture="environment" hidden
             id="goaShot-${c.id}" onchange="uploadPhoto(${c.id}, 'goa', this)">
      <span class="pmark">&#43;</span>
      <span class="ptxt"><b>${t('o.ph_goa')}</b><small>${t('o.ph_goa_h')}</small></span>
    </label>` : ''}
    <div class="pnote" id="pnote-${c.id}"></div>
  </details>`;
}

/* ── photo viewer ──────────────────────────────────────────────────────
   A 44px thumbnail is enough to see that a photo exists and nothing else. The
   whole point of these is looking closely at a bumper, so they open full size.

   The image is fetched through the same authenticated endpoint as the
   thumbnail — there is no public URL for it, and there should not be. */
function openPhoto(id, label){
  const box = document.getElementById('lightbox');
  document.getElementById('lbImg').src = 'api/calls/photo?id=' + id;
  document.getElementById('lbCap').textContent = label || '';
  box.classList.add('on');
  // Stop the page behind scrolling under the viewer on a phone.
  document.body.style.overflow = 'hidden';
}

function closePhoto(){
  document.getElementById('lightbox').classList.remove('on');
  // Drop the source so a large photo is not held in memory behind the overlay.
  document.getElementById('lbImg').src = '';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closePhoto();
});

/* One position read, shared by the photo upload and the GOA claim.
   Resolves to null rather than rejecting: every caller treats a missing fix as
   "carry on without it", because the alternative is blocking a driver from
   recording what he saw. */
function currentPosition(timeoutMs = 8000){
  return new Promise(resolve => {
    if(!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat: p.coords.latitude, lng: p.coords.longitude,
                    accuracy: p.coords.accuracy}),
      () => resolve(null),
      {enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 15000}
    );
  });
}

// Which photo panels the operator had open, kept across the refresh that
// follows every upload — otherwise it snaps shut mid-walk-around.
const OPEN_PHOTOS = new Set();
function rememberPhotos(el){
  const id = String(el.dataset.call);
  if(el.open) OPEN_PHOTOS.add(id); else OPEN_PHOTOS.delete(id);
}

async function uploadPhoto(callId, type, input){
  const file = input.files && input.files[0];
  if(!file) return;
  OPEN_PHOTOS.add(String(callId));

  const note = document.getElementById('pnote-' + callId);
  if(note){ note.textContent = t('o.ph_saving'); note.className = 'pnote'; }

  const fd = new FormData();
  fd.append('call_id', callId);
  fd.append('photo_type', type);
  fd.append('file', file);

  // Where it was taken. Best effort and never blocking — a driver in an
  // underground car park may get no fix at all, and refusing the photograph
  // over that would lose the evidence entirely. The server stamps the IP and
  // the time regardless.
  const pos = await currentPosition();
  if(pos){
    fd.append('lat', pos.lat);
    fd.append('lng', pos.lng);
    if(pos.accuracy != null) fd.append('accuracy_m', Math.round(pos.accuracy));
  }

  // Multipart, so no Content-Type header — the browser has to set the boundary
  // itself, and api() sends JSON.
  let r;
  try {
    const res = await fetch(`${API}/calls/photo?lang=${tlLang()}`, {
      method: 'POST',
      headers: TOKEN ? {'Authorization': 'Bearer ' + TOKEN} : {},
      body: fd,
    });
    r = await res.json();
  } catch(e){ r = {success:false, error: t('o.ph_failed')}; }

  input.value = '';   // so re-taking the same slot fires change again

  if(!r.success){
    if(note){ note.textContent = r.error || t('o.ph_failed'); note.className = 'pnote bad'; }
    return;
  }
  if(note) note.textContent = '';

  // Patch this one job in place instead of reloading the whole board.
  //
  // load() refetched everything and rebuilt the list, which threw the operator
  // back to the top of the page — mid walk-around, with the car he is
  // photographing scrolled off the screen. The server already returned the new
  // checklist with the upload, so there is nothing worth a second request for.
  const job = (DATA || []).find(x => x.id === callId);
  if(job){
    job.photo_state = r.photos;
    const y = window.scrollY;
    render();
    // render() replaces the list wholesale; nothing above this card changed
    // height, so putting the scroll back lands exactly where he was.
    window.scrollTo(0, y);
  } else {
    load();
  }
}

/* ── gone on arrival ───────────────────────────────────────────────────
   The driver turned out and the vehicle was not there. He has earned the
   call-out fee and the customer gets the rest of their hold back.

   This is money moving on one person's word, so it is the one action that
   insists on evidence: a photograph of the empty space, taken on scene, with
   the position from the phone and the IP and time stamped on by the server.
   Until job photos could be uploaded at all, that rule made GOA impossible
   rather than careful. */
async function claimGOA(id){
  const job = (DATA || []).find(x => x.id === id);
  const ps  = job && job.photo_state;
  // has_goa comes from the server, which counts the rows. The required-items
  // list does not include gone-on-arrival — it is an extra shot, not a step in
  // the walk-around — so checking it there would always come back false.
  const hasProof = !!(ps && ps.has_goa);

  // The photo comes FIRST, before anything is claimed. Asking afterwards means
  // the driver has already pulled away from the space he was meant to
  // photograph.
  if(!hasProof){
    alert(t('o.goa_need_photo'));
    OPEN_PHOTOS.add(String(id));
    const input = document.getElementById('goaShot-' + id);
    if(input) input.click();
    return;
  }

  if(!confirm(t('o.goa_confirm', {amount: money(job.goa_amount || 0)}))) return;

  const pos = await currentPosition();
  const body = {call_id: id};
  if(pos){ body.lat = pos.lat; body.lng = pos.lng; }

  const r = await api('/calls/goa', {method:'POST', body: JSON.stringify(body)});
  if(!r.success) return alert(r.error);
  alert(t('o.goa_done', {amount: money(r.goa_amount || 0)}));
  load();
}

async function advance(id, cur, svc){
  const next = towSteps(svc)[cur];
  if(next === 'complete'){
    // Last chance to take the photographs, naming the ones that are actually
    // missing rather than saying "some photos". Not a block: refusing to let a
    // driver close a job at 2am over a photograph strands his payout. He is
    // told plainly what he is giving up, and the server records that he went
    // ahead — which is what answers a damage claim either way.
    const job = (DATA || []).find(x => x.id === id);
    const ps  = job && job.photo_state;
    if(ps && ps.required && !ps.complete){
      if(!confirm(t('o.ph_confirm', {missing: ps.missing_summary}))) return;
    }

    const r = await api('/calls/complete', {method:'POST', body:JSON.stringify({call_id:id})});
    if(!r.success) return alert(r.error);
    alert(t('o.completed_msg', {amount: money(r.net_to_you)}));
  } else {
    const r = await api('/calls/status', {method:'POST', body:JSON.stringify({call_id:id, status:next})});
    if(!r.success) return alert(r.error);
  }
  load();
}
async function cancelCall(id){
  if(!confirm('Cancel this call? Held funds return to your balance.')) return;
  const r = await api('/calls/cancel', {method:'POST', body:JSON.stringify({call_id:id})});
  if(!r.success) return alert(r.error);
  await refreshWallet(); load();
}

/* ── post a call ───────────────────────────────────────────────── */
function openPost(){ document.getElementById('postModal').classList.add('on'); renderCost(); }
function closePost(){ document.getElementById('postModal').classList.remove('on'); }
function renderCost(){
  const a = Number(document.getElementById('pAmount').value || 0);
  document.getElementById('costNote').innerHTML =
    `Holds <b>${money(a)}</b> from your balance until the call closes`;
}
async function submitCall(){
  const err = document.getElementById('postErr'); err.classList.add('hide');
  const body = {
    service_type: pService.value, vehicle_class: pClass.value,
    pickup_address: pPickup.value, pickup_city: pCity.value, pickup_state: pState.value,
    // Geocoding is wired to the address field in the live build; until then
    // the form seeds Miami coordinates so distances render correctly.
    pickup_lat: 25.7617, pickup_lng: -80.1918,
    dropoff_address: pDrop.value || null,
    dropoff_city: pDrop.value ? 'Hialeah' : null, dropoff_state: pDrop.value ? 'FL' : null,
    dropoff_lat: pDrop.value ? 25.8576 : null, dropoff_lng: pDrop.value ? -80.2781 : null,
    vehicle_year: pYear.value, vehicle_make: pMake.value, vehicle_model: pModel.value,
    has_keys: pKeys.checked, wheels_lock: pWheels.checked,
    is_accident: pAccident.checked, is_ev: pEV.checked,
    customer_name: pCName.value, customer_phone: pCPhone.value,
    pricing_mode: pMode.value, offer_amount: Number(pAmount.value),
    goa_amount: Number(pGoa.value), expires_in_minutes: Number(pExpiry.value)
  };
  const r = await api('/calls/create', {method:'POST', body:JSON.stringify(body)});
  if(!r.success){ err.textContent = r.error; err.classList.remove('hide'); return; }
  closePost(); await refreshWallet(); load();
}

/* ── accept / bid ──────────────────────────────────────────────── */
let ACT = null;
function openAct(id, mode){
  ACT = {id, mode};
  const c = DATA.find(x => x.id === id);
  document.getElementById('actTitle').textContent = t('o.accept_job');
  document.getElementById('actGo').textContent    = t('o.accept');
  document.getElementById('actSummary').innerHTML =
    `<div style="font-size:15px;font-weight:600;margin-bottom:4px">${c.pickup_area}${c.dropoff_city?' → '+c.dropoff_city:''}</div>
     <div style="color:var(--ink-dim);font-size:13px">${c.vehicle} &middot; ${c.service_type.replace('_',' ')} &middot; posted at ${money(c.offer_amount)}</div>`;
  document.getElementById('bidAmtWrap').style.display  = mode === 'bid' ? '' : 'none';
  document.getElementById('bidNoteWrap').style.display = mode === 'bid' ? '' : 'none';
  document.getElementById('actAmount').value = c.offer_amount;
  document.getElementById('actErr').classList.add('hide');
  renderActNet();
  document.getElementById('actModal').classList.add('on');
}
function closeAct(){ document.getElementById('actModal').classList.remove('on'); }
function renderActNet(){
  const c = DATA.find(x => x.id === ACT.id);
  const amt = ACT.mode === 'bid' ? Number(document.getElementById('actAmount').value||0) : c.offer_amount;
  // Fixed-price accepts use the server's figure; a typed bid can only be
  // estimated client-side, and the real number is confirmed on submit.
  const fee = (ACT.mode === 'accept' && c.platform_fee_estimate != null)
                ? c.platform_fee_estimate : feeOn(amt);
  document.getElementById('actNet').innerHTML =
    `${t('o.you_receive')} <b>${money(amt-fee)}</b> &nbsp;<span style="opacity:.7">${t('o.less_fee', {total: money(amt), fee: money(fee)})}</span>`;
}
async function submitAct(){
  const err = document.getElementById('actErr'); err.classList.add('hide');
  const eta = Number(document.getElementById('actEta').value);
  let r;
  if(ACT.mode === 'bid'){
    r = await api('/bids/create', {method:'POST', body:JSON.stringify({
      call_id: ACT.id, amount: Number(document.getElementById('actAmount').value),
      eta_minutes: eta, note: document.getElementById('actNote').value })});
  } else {
    r = await api('/calls/accept', {method:'POST', body:JSON.stringify({call_id: ACT.id, eta_minutes: eta})});
  }
  if(!r.success){ err.textContent = r.error; err.classList.remove('hide'); return; }
  closeAct();

  if(ACT.mode === 'accept'){
    alert(`${t('o.job_yours')}\n\n${r.customer_name} — ${r.customer_phone}\n${r.pickup_address}`);
    // Straight to My jobs. The board is a list of work you have NOT got, so
    // leaving an operator staring at it after accepting shows him the one
    // screen where his new job does not appear — and the customer's phone
    // number, the address and the buttons that run the job are all on the
    // other tab. switchView calls load() itself.
    switchView('mine');
    return;
  }

  load();
}

// A stale board is a lost call, so refresh on a timer and tick the countdowns.
/* ── Polling, and realtime on top of it ───────────────────────────────────
   The interval never stops. When a socket is connected it stretches out; when
   the socket drops it snaps back. A realtime layer that REPLACED polling would
   put a new moving part between a stranded customer and a truck, and the
   failure would be silent — an operator staring at a board that stopped
   updating half an hour ago and looks completely normal. */
let BOARD_POLL_MS = 20000;
let boardTimer = setInterval(boardTick, BOARD_POLL_MS);

function boardTick(){ if(ME && VIEW === 'board') load(); }

function setBoardPoll(ms){
  if(ms === BOARD_POLL_MS) return;
  BOARD_POLL_MS = ms;
  clearInterval(boardTimer);
  boardTimer = setInterval(boardTick, BOARD_POLL_MS);
}

// Called by realtime.js on connect/disconnect.
function onRealtimeUp(){   setBoardPoll(120000); }
function onRealtimeDown(){ setBoardPoll(20000);  }

// Every handler refetches rather than trusting the payload. The socket says
// what changed; the API decides what this operator may see.
function startRealtime(){
  if(!ME || typeof TLRealtime === 'undefined') return;
  TLRealtime.connect({ token: TOKEN }, {
    'job.posted':  () => { if(VIEW === 'board') load(); },
    'job.closed':  () => { if(VIEW === 'board') load(); },
    'job.changed': () => load(),
  });
}

// Countdowns tick in place. This used to call render(), which rebuilt every
// card once a second — so an operator who opened the price breakdown watched it
// slam shut within a second, every time. Nothing else on a card changes between
// server refreshes, so nothing else needs redrawing.
setInterval(tickTimers, 1000);

</script>

     is already defined by the time boot reaches it. -->
