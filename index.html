<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + the safe-area padding below keeps the header clear of
     the notch once this is running full screen from the Home Screen. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TowSling — Trabajos para operadores de grúa</title>

<!-- ─── Installable app ──────────────────────────────────────────────────
     iOS reads none of the manifest's display or icon fields; it needs its own
     apple-* tags, and without apple-mobile-web-app-capable the Home Screen
     icon opens a plain Safari tab — which cannot receive push at all. -->
<link rel="manifest" href="manifest.json?v=20260816h">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TowSling">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1b232d; --line:#242e3a;
  --ink:#e6edf3; --ink-dim:#8b98a8; --ink-faint:#5d6b7d;
  --accent:#ff7a18; --accent-dim:#c25a0e;
  --green:#2ea043; --green-dim:#1a6b2c; --red:#e5534b; --amber:#d29922; --blue:#4a9eff;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;border-radius:6px}
input,select{font:inherit}

/* ── shell ─────────────────────────────────────────────────────── */
header{
  display:flex;align-items:center;gap:20px;padding:0 20px;height:56px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.3px}
.logo .mark{
  width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent-dim));
  color:#0d1117;font-weight:800;font-size:12px;
}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{
  padding:7px 14px;border-radius:6px;background:transparent;color:var(--ink-dim);
  font-weight:500;transition:.12s;
}
.tab:hover{color:var(--ink);background:var(--panel-2)}
.tab.on{background:var(--panel-2);color:var(--ink)}
.spacer{flex:1}
.whoami{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-dim)}
.badge{
  padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;
}
.badge.provider{background:rgba(74,158,255,.14);color:var(--blue)}
.badge.tower{background:rgba(255,122,24,.14);color:var(--accent)}
.wallet{
  padding:5px 12px;border-radius:6px;background:var(--panel-2);
  border:1px solid var(--line);font-variant-numeric:tabular-nums;
}
.wallet b{color:var(--green)}
.wallet .held{color:var(--amber)}

main{max-width:1400px;margin:0 auto;padding:22px 20px 60px}

/* ── board ─────────────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:20px;font-weight:650;letter-spacing:-.3px}
.sub{color:var(--ink-faint);font-size:13px}
.filters{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.filters select,.filters input{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:7px 11px;border-radius:6px;outline:none;
}
.filters select:focus,.filters input:focus{border-color:var(--accent)}

.cards{display:grid;gap:10px}
.call{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;display:grid;
  grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;
  transition:.14s;
}
.call:hover{border-color:#33404f;background:var(--panel-2)}
.call.urgent{border-left:3px solid var(--red)}
.call.mine{border-left:3px solid var(--green)}

.c-main{min-width:0}
.c-top{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.svc{
  padding:3px 9px;border-radius:5px;background:rgba(255,122,24,.13);
  color:var(--accent);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;
}
.svc.lockout{background:rgba(74,158,255,.13);color:var(--blue)}
.svc.winch_recovery{background:rgba(229,83,75,.13);color:var(--red)}
.cnum{color:var(--ink-faint);font-size:12px;font-variant-numeric:tabular-nums}
.funded{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  color:var(--green);background:rgba(46,160,67,.11);padding:3px 8px;border-radius:5px;
}
.route{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;margin-bottom:5px}
.route .arrow{color:var(--ink-faint);font-weight:400}
.route .miles{
  font-size:12px;font-weight:600;color:var(--ink-dim);background:var(--panel-2);
  padding:2px 8px;border-radius:5px;border:1px solid var(--line);
}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-dim);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.flag{color:var(--amber);font-weight:600;font-size:12px}

/* High demand. Shown to the operator with the multiplier, because they are
   deciding whether to roll; the customer only ever sees one price. */
.surge{
  background:#3b2d12;color:#fbbf24;border-radius:999px;
  padding:2px 8px;font-size:11px;font-weight:750;letter-spacing:.2px;
}

/* ── itemised job breakdown (operators only) ──────────────
   The customer sees one number. A driver decides on whether the money covers
   22 miles and a winch, so they get every line and the net after the fee. */
.bd{margin-top:11px}
.bd summary{
  cursor:pointer;color:var(--ink-2);font-size:12.5px;font-weight:650;
  list-style:none;padding:5px 0;user-select:none;
}
.bd summary::-webkit-details-marker{display:none}
.bd summary::before{content:'▸ ';color:var(--ink-faint)}
.bd[open] summary::before{content:'▾ '}
.bl{
  display:flex;justify-content:space-between;gap:14px;
  padding:5px 0 5px 14px;font-size:12.5px;color:var(--ink-2);
}
.bl b{color:var(--ink);font-weight:650;white-space:nowrap}
.bl.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:8px;font-weight:700;color:var(--ink)}
.bl.fee b{color:var(--ink-faint)}
.bl.net{font-weight:750;color:var(--green,#22c55e)}
.bl.net b{color:var(--green,#22c55e)}

/* ── driver location sharing ──────────────────────────────
   Deliberately visible. A driver who cannot see that his location is being
   sent, and cannot stop it in one tap, will solve the problem by logging out —
   and then he stops getting jobs too. */
.share-bar{
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);background:var(--panel-2);
  border-radius:12px;padding:12px 15px;margin-bottom:14px;
}
.share-bar.on{border-color:#14532d;background:#0e1a13}
.share-bar.off{border-color:#7c5a10;background:#241d0d}
.share-bar b{font-size:13px;font-weight:700}
.share-bar > div{flex:1;min-width:0}
.share-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.share-bar .btn{flex:none;padding:6px 12px;font-size:12px}

/* ── push alerts ──────────────────────────────────────────
   Same visual family as the verification banner on purpose: both are "you
   cannot earn until you finish this", and an operator should read them the
   same way. */
.push-bar{
  border:1px solid var(--line);background:var(--panel-2);border-radius:12px;
  padding:15px 17px;margin-bottom:18px;
}
.push-bar.warn{border-color:#7c5a10;background:#241d0d}
.push-bar.err{border-color:#7f1d1d;background:#221010}
.push-bar h4{font-size:14px;font-weight:750;margin-bottom:5px;color:#fbbf24}
.push-bar.err h4{color:#f0776f}
.push-bar p{font-size:13px;color:var(--ink-dim);line-height:1.6;margin-bottom:0}
.push-bar .btn{margin-top:12px}
/* App Store / Play button. Apple's real badge is a licensed image; this is the
   same shape drawn in CSS so the shell stays self-contained and offline-safe. */
.store-btn{
  display:inline-flex;align-items:center;gap:10px;margin-top:14px;
  background:#000;color:#fff;border:1px solid #3a3a3c;border-radius:10px;
  padding:9px 16px 9px 13px;text-decoration:none;line-height:1.15;
}
.store-btn:hover{background:#151517;border-color:#5a5a5e}
.store-btn .store-txt{display:flex;flex-direction:column}
.store-btn small{font-size:10.5px;letter-spacing:.02em;opacity:.9}
.store-btn b{font-size:17px;font-weight:650;letter-spacing:-.2px}

.push-steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
.push-steps li{
  display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);
  padding:7px 0;line-height:1.4;
}
.push-steps .sq{
  flex:none;width:26px;height:26px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--blue);font-weight:700;font-size:14px;
}
.push-fine{font-size:11.5px;color:var(--ink-faint);line-height:1.55;margin-top:9px}
.push-fine.err-text{color:#f0776f}
.warn-text{color:#e3b341}

.pane{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin-bottom:14px;overflow:hidden;
}
.pane-h{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);
}
.pane-h h3{font-size:13px;font-weight:700;letter-spacing:.2px}
.pane-status{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:7px}
.pane-b{padding:16px}
.pane-b .btn{margin-top:6px;margin-right:8px}
.pane-b .f{margin-bottom:15px}
.pane-b .f label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px}
.pane-b .f input,.pane-b .f select{
  /* Capped rather than full-width: a number field stretched across a 1400px
     desktop reads as a text area and invites a paragraph. */
  width:100%;max-width:340px;padding:9px 11px;border-radius:7px;background:var(--bg);
  border:1px solid var(--line);color:var(--ink);
}
.pane-b .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px}
.pane-b .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;line-height:1.5}
.pane-b .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:16px}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--ink-faint)}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(46,160,67,.15)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(210,153,34,.15)}
.dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(229,83,75,.15)}

.device{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.device:last-child{border-bottom:0}
.device .dot{margin-top:5px}
.device-t{font-size:13px;font-weight:600;text-transform:capitalize}

/* Running full screen from the Home Screen there is no browser chrome, so the
   header sits under the notch unless it is padded out of the safe area. */
@supports (padding:env(safe-area-inset-top)){
  header{
    height:calc(56px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
  }
}

/* ── verification banner ──────────────────────────────── */
.verify-bar{
  border:1px solid #7c5a10;background:#241d0d;border-radius:12px;
  padding:15px 17px;margin-bottom:18px;
}
.verify-bar.ok{border-color:#14532d;background:#0e1a13}
.verify-bar h4{font-size:14px;font-weight:750;margin-bottom:5px;color:#fbbf24}
.verify-bar.ok h4{color:#4ade80}
.verify-bar p{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:0}
.verify-bar .vb-act{margin-top:12px}
.vdocs{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.vdocs-wrap{margin-top:14px}
.vdocs-wrap summary{
  cursor:pointer;list-style:none;font-size:12.5px;font-weight:700;
  color:var(--ink-dim);padding:6px 0;user-select:none;
}
.vdocs-wrap summary::-webkit-details-marker{display:none}
.vdocs-wrap summary::before{content:'▸ ';color:var(--ink-faint)}
.vdocs-wrap[open] summary::before{content:'▾ '}
.vrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .vm{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
}
.vrow.have .vm{background:#16a34a;border-color:#16a34a;color:#04140a}
.vrow .vi{flex:1;min-width:0}
.vrow .vi b{display:block;font-size:13px;font-weight:700}
.vrow .vi small{font-size:11.5px;color:var(--ink-faint)}
.vbtn{
  background:var(--ink);color:var(--bg,#0c1017);border-radius:8px;padding:7px 11px;
  font-size:12.5px;font-weight:700;cursor:pointer;flex:none;
}
.vrow input[type=date]{width:auto;padding:6px 8px;font-size:12px;flex:none}

.c-side{display:flex;align-items:center;gap:18px}
.pay{text-align:right}
.pay .amt{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pay .net{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.pay .mode{
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;
  color:var(--blue);margin-top:2px;
}
.timer{
  text-align:center;min-width:62px;font-variant-numeric:tabular-nums;
}
.timer .t{font-size:16px;font-weight:700;color:var(--green)}
.timer.warn .t{color:var(--amber)}
.timer.crit .t{color:var(--red)}
.timer .l{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px}
.act{display:flex;flex-direction:column;gap:6px;min-width:104px}
.btn{padding:9px 16px;font-weight:650;font-size:13px;transition:.12s}
.btn.go{background:var(--accent);color:#0d1117}
.btn.go:hover{background:#ff8c38}
.btn.ghost{background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:#33404f}
.btn.green{background:var(--green);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed}
.dist{
  font-size:12px;color:var(--ink-dim);text-align:center;font-weight:600;
  font-variant-numeric:tabular-nums;
}

.empty{
  text-align:center;padding:70px 20px;color:var(--ink-faint);
  background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
}
.empty h3{font-size:16px;color:var(--ink-dim);margin-bottom:6px;font-weight:600}

.notice{
  padding:12px 16px;border-radius:var(--radius);margin-bottom:14px;font-size:13px;
  display:flex;align-items:center;gap:10px;
}
.notice.warn{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);color:#e3b341}
.notice.err{background:rgba(229,83,75,.1);border:1px solid rgba(229,83,75,.3);color:#f0776f}
.notice.ok{background:rgba(46,160,67,.1);border:1px solid rgba(46,160,67,.3);color:#56d364}

/* ── forms / modal ─────────────────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px;font-weight:600}
.f input,.f select{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  padding:9px 11px;border-radius:6px;outline:none;
}
.f input:focus,.f select:focus{border-color:var(--accent)}
.f{margin-bottom:14px}
fieldset{border:none;margin-bottom:16px}
legend{
  font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);
  font-weight:700;margin-bottom:12px;
}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;color:var(--ink-dim);cursor:pointer;font-size:13px}
.chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;
  align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;overflow:auto;
}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:720px}
.modal-h{
  padding:18px 22px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-h h2{font-size:17px;font-weight:650}
.modal-b{padding:22px}
.modal-f{
  padding:16px 22px;border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;align-items:center;
}
.x{background:transparent;color:var(--ink-faint);font-size:22px;line-height:1;padding:0 6px}
.x:hover{color:var(--ink)}

.cost{
  margin-right:auto;font-size:13px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;
}
.cost b{color:var(--ink)}

/* ── login ─────────────────────────────────────────────────────── */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:400px}
.login .brand{text-align:center;margin-bottom:26px}
.login .brand .mark{
  width:52px;height:52px;border-radius:13px;margin:0 auto 14px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent-dim));
  color:#0d1117;font-weight:800;font-size:21px;
}
.login .brand h1{font-size:24px;letter-spacing:-.5px;margin-bottom:5px}
.login .brand p{color:var(--ink-faint);font-size:13px}
.demo-pick{display:grid;gap:9px;margin-top:16px}
.demo-btn{
  padding:13px 15px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);text-align:left;color:var(--ink);transition:.14s;
}
.demo-btn:hover{border-color:var(--accent)}
.demo-btn b{display:block;font-size:14px;margin-bottom:2px}
.demo-btn span{font-size:12px;color:var(--ink-faint)}
.hide{display:none !important}

@media(max-width:820px){
  .call{grid-template-columns:1fr}
  .c-side{justify-content:space-between}
  .grid2,.grid3{grid-template-columns:1fr}

  /* The tabs used to be hidden at this width, from when a tower had only two
     of them and the board was always the one you wanted. Alerts changed that:
     it is the screen an operator most needs to reach, and he is only ever on a
     phone. Hidden tabs would have made it unreachable on the one device that
     matters. Wrapped onto their own scrollable row instead. */
  header{
    height:auto;flex-wrap:wrap;gap:0 14px;padding:9px 14px;
    padding-top:calc(9px + env(safe-area-inset-top, 0px));
  }
  .tabs{
    display:flex;order:9;width:100%;margin:9px 0 0;gap:4px;
    overflow-x:auto;scrollbar-width:none;
    border-top:1px solid var(--line);padding-top:9px;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 15px;font-size:13px;white-space:nowrap;flex:none}

  .pane-b .f2{grid-template-columns:1fr}
}

/* rate sheet */
.rates{margin:14px 0 6px}
.rate-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--line)}
.rate-row:last-child{border-bottom:none}
.rate-name{flex:1 1 130px;font-weight:650;font-size:14.5px;padding-bottom:9px}
.rate-fields{display:flex;gap:9px;flex-wrap:wrap}
.rate-fields label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;
  font-weight:650;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px}
.rate-fields input{width:86px;padding:9px 10px;border-radius:9px;text-align:right;
  background:var(--panel-2);color:var(--ink);border:1px solid var(--line);outline:none}
.rate-fields input:focus{border-color:var(--accent)}
.rate-fields input::placeholder{color:var(--ink-faint)}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div class="login-wrap" id="loginView">
  <div class="login">
    <div class="brand">
      <div class="mark">TS</div>

<script src="i18n.js?v=20260816h"></script>
<script>
const API = 'api';
let TOKEN = localStorage.getItem('tl_token') || '';
let ME = null, VIEW = 'board', DATA = [], FEE_PCT = 10, FEE_MIN = 5;

// Escapes anything that came from outside this file before it goes into
// innerHTML. Most strings on this page are from the server's own catalogue and
// are safe, but an API error message is not a fixed set, and a company name is
// typed by whoever signed up.
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

/* ── api ───────────────────────────────────────────────────────── */
async function api(path, opts={}){
  // Language rides along so API errors match the interface.
  const url = API + path + (path.includes('?') ? '&' : '?') + 'lang=' + tlLang();
  const r = await fetch(url, {
    ...opts,
    headers:{'Content-Type':'application/json', ...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{}), ...(opts.headers||{})}
  });
  return r.json();
}
const money = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const feeOn = a => Math.min(a, Math.max(FEE_MIN, Math.round(a*FEE_PCT)/100));

/* ── auth ──────────────────────────────────────────────────────── */
function demo(kind){
  document.getElementById('liEmail').value = kind==='provider' ? 'ops@sunshinemc.test' : 'disp@tricounty.test';
  document.getElementById('liPass').value  = 'testpass123';
  doLogin();
}
async function doLogin(){
  const err = document.getElementById('liErr');
  err.classList.add('hide');
  const res = await api('/auth/login', {method:'POST', body: JSON.stringify({
    email: document.getElementById('liEmail').value.trim(),
    password: document.getElementById('liPass').value
  })});
  if(!res.success){ err.textContent = res.error; err.classList.remove('hide'); return; }
  TOKEN = res.token; localStorage.setItem('tl_token', TOKEN);
  await boot();
}
async function logout(){
  // The session cookie the service worker uses lives on the server side of
  // this call. Clearing localStorage alone would leave a phone able to
  // re-register itself against an account its driver has signed out of.
  try { await api('/auth/logout', {method:'POST'}); } catch(e){}
  try { TLRealtime.disconnect(); } catch(e){}
  try { await TLPush.disable(); } catch(e){}
  TOKEN=''; localStorage.removeItem('tl_token'); location.reload();
}

async function boot(){
  const me = await api('/auth/me');
  if(!me.success){ TOKEN=''; localStorage.removeItem('tl_token');
    document.getElementById('loginView').classList.remove('hide');
    document.getElementById('appView').classList.add('hide'); return; }
  ME = me;
  document.getElementById('loginView').classList.add('hide');
  document.getElementById('appView').classList.remove('hide');
  document.getElementById('acctName').textContent = me.account.name;
  // Named badge, not `t` — a local `t` shadows the translation function and
  // every t('...') call in this scope becomes "t is not a function".
  const typeBadge = document.getElementById('acctType');
  typeBadge.textContent = me.account.account_type;
  typeBadge.className = 'badge ' + me.account.account_type;

  const isTower = me.account.account_type === 'tower';
  document.getElementById('tabs').innerHTML = isTower
    ? `<button class="tab" data-v="board">${t('o.available_jobs')}</button><button class="tab" data-v="mine">${t('o.my_jobs')}</button><button class="tab" data-v="alerts">${t('o.alerts')}</button><button class="tab" data-v="rates">${t('o.rates')}</button>`
    : `<button class="tab" data-v="mine">${t('o.my_jobs')}</button>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchView(b.dataset.v));

  if(!isTower) await refreshWallet();
  if(isTower){ renderVerifyBar(); renderPushBanner(); }

  startRealtime();

  // A notification tap lands on ?job=<id>; go straight to the board so the job
  // is the first thing on screen rather than whichever tab was last open.
  const jump = new URLSearchParams(location.search).get('tab');
  switchView(isTower ? (jump === 'alerts' ? 'alerts' : 'board') : 'mine');
}

/* ── verification ────────────────────────────────────────────────
   A company that signed up on a phone and never finished uploading cannot take
   a single job, and nothing on the board tells them why. This banner is that
   explanation, and it carries the upload controls so finishing is one tap from
   where they already are rather than a page they have to find. */
async function renderVerifyBar(){
  const status = ME.account.verification_status;
  const box = document.getElementById('notices');

  if(status === 'approved'){
    box.innerHTML = `<div class="verify-bar ok">
      <h4>&#10003; ${t('o.verified_h')}</h4>
      <p>${t('o.verified_p')}</p></div>`;
    return;
  }

  const r = await api('/docs/mine');
  const list = (r.success ? r.checklist : []);
  const missing = list.filter(c => !c.uploaded).length;

  box.innerHTML = `<div class="verify-bar">
    <h4>${status === 'pending' ? t('o.review_h') : t('o.unverified_h')}</h4>
    <p>${status === 'pending' ? t('o.review_p')
        : status === 'rejected' ? (r.rejection_reason || t('o.rejected_p'))
        : t('o.unverified_p', {n: missing})}</p>
    ${missing || status === 'rejected' ? `
      <!-- Collapsed unless something was actually rejected. A company that just
           signed up is not asked for four documents before it has seen a single
           job; the platform asks at review, and this is here only for the
           operator who wants to get ahead of it. -->
      <details class="vdocs-wrap" ${status === 'rejected' ? 'open' : ''}>
        <summary>${status === 'rejected' ? t('j.docs_fix') : t('j.docs_optional')}</summary>
      <div class="vdocs">
        ${list.map(c => `
          <div class="vrow ${c.uploaded ? 'have' : ''}">
            <div class="vm">${c.uploaded ? '✓' : ''}</div>
            <div class="vi"><b>${c.label}</b><small>${
              c.uploaded ? (c.status === 'rejected' ? t('j.doc_rejected') + (c.notes ? ' — ' + c.notes : '')
                                                     : t('j.doc_received'))
                         : t('j.doc_missing')}</small></div>
            ${c.doc_type.indexOf('coi') === 0
              ? `<input type="date" id="vexp_${c.doc_type}" title="${t('j.doc_expiry')}">` : ''}
            <label class="vbtn">${c.uploaded ? t('j.doc_replace') : t('j.doc_upload')}
              <input type="file" accept=".pdf,.jpg,.jpeg,.png,.heic,.webp" style="display:none"
                     onchange="uploadVerifyDoc('${c.doc_type}', this)">
            </label>
          </div>`).join('')}
      </div>
      </details>` : ''}
  </div>`;
}

async function uploadVerifyDoc(docType, input){
  const file = input.files[0];
  if(!file) return;

  const expEl = document.getElementById('vexp_' + docType);
  if(docType.indexOf('coi') === 0 && expEl && !expEl.value){
    input.value = '';
    return alert(t('j.err_expiry'));
  }

  const fd = new FormData();
  fd.append('doc_type', docType);
  fd.append('file', file);
  if(expEl && expEl.value) fd.append('expires_at', expEl.value);

  // No Content-Type header — the browser must set the multipart boundary.
  const r = await fetch(API + '/docs/upload?lang=' + tlLang(), {
    method:'POST',
    headers:{'Authorization':'Bearer ' + TOKEN, 'X-Auth-Token':TOKEN},
    body:fd
  }).then(x => x.json()).catch(() => ({success:false, error:'Upload failed'}));

  input.value = '';
  if(!r.success) return alert(r.error);

  // The account flips to Pending the moment the last document lands, so the
  // banner has to be re-read rather than patched.
  const me = await api('/auth/me');
  if(me.success) ME = me;
  renderVerifyBar();
}

async function refreshWallet(){
  const w = await api('/wallet/balance');
  if(!w.success) return;
  document.getElementById('walletBox').innerHTML =
    `<span class="wallet">Available <b>${money(w.available)}</b>` +
    (Number(w.held) > 0 ? ` &middot; Held <span class="held">${money(w.held)}</span>` : '') + `</span>`;
}


/* ── rate sheet ────────────────────────────────────────────────────
   What this company charges, in its own words. It is never shown to another
   company and there is no endpoint that would let one ask; it exists so a
   market can be priced from what the people working in it actually charge.

   The figure asked for is what they want to RECEIVE. Our cut comes out of the
   customer's total, so the customer price is grossed up on the server — ask
   for "what you charge" and pay them less than that and every job gets
   declined by people who think they were misled.
   ──────────────────────────────────────────────────────────────── */
async function renderRatesPane(){
  const pane = document.getElementById('ratesPane');
  if(!pane) return;
  pane.innerHTML = `<div class="empty">${t('o.loading')}</div>`;

  const r = await api('/rates');
  if(!r.success){ pane.innerHTML = `<div class="empty"><p>${esc(r.error||'')}</p></div>`; return; }

  const row = x => `
    <div class="rate-row" data-s="${x.service_type}" data-c="${x.vehicle_class}">
      <div class="rate-name">${esc(x.label)}</div>
      <div class="rate-fields">
        <label>${t('rt.price')}
          <input type="number" min="0" step="1" class="r-base"
                 value="${x.base_fee ?? ''}" placeholder="—"></label>
        ${x.asks_hook ? `
        <label>${t('rt.hook')}
          <input type="number" min="0" step="1" class="r-hook"
                 value="${x.hook_fee ?? ''}" placeholder="—"></label>` : ''}
        ${x.asks_miles ? `
        <label>${t('rt.included')}
          <input type="number" min="0" step="1" class="r-miles"
                 value="${x.included_miles ?? ''}" placeholder="—"></label>
        <label>${t('rt.permile')}
          <input type="number" min="0" step="0.5" class="r-per"
                 value="${x.per_mile ?? ''}" placeholder="—"></label>` : ''}
      </div>
    </div>`;

  pane.innerHTML = `
    <div class="pane">
      <div class="pane-h"><h3>${t('o.rates')}</h3></div>
      <div class="pane-b">
        <p class="push-fine">${esc(r.note || '')}</p>
        <div class="rates">${(r.rows||[]).map(row).join('')}</div>
        <p class="push-fine">${t('rt.blank_note')}</p>
        <p class="push-fine">${t('rt.hook_note')}</p>
        <p class="push-fine">${t('rt.miles_note')}</p>
        <button class="btn go" onclick="saveRates(this)">${t('rt.save')}</button>
        <div id="rateMsg" class="push-fine"></div>
      </div>
    </div>`;
}

async function saveRates(btn){
  btn.disabled = true;
  const rows = [...document.querySelectorAll('.rate-row')].map(el => ({
    service_type:   el.dataset.s,
    vehicle_class:  el.dataset.c,
    base_fee:       el.querySelector('.r-base')?.value  ?? '',
    hook_fee:       el.querySelector('.r-hook')?.value  ?? '',
    included_miles: el.querySelector('.r-miles')?.value ?? '',
    per_mile:       el.querySelector('.r-per')?.value   ?? '',
  }));
  const r = await api('/rates/save', {method:'POST', body:JSON.stringify({rows})});
  btn.disabled = false;
  const msg = document.getElementById('rateMsg');
  msg.textContent = r.success ? (r.message || t('rt.saved')) : (r.error || '');
  msg.style.color = r.success ? 'var(--green)' : 'var(--red)';
}

/* ── views ─────────────────────────────────────────────────────── */
function switchView(v){
  VIEW = v;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const isTower = ME.account.account_type === 'tower';
  const f = document.getElementById('filters');

  // Alerts is a settings screen, not a list of jobs, so it swaps the card list
  // out rather than filtering it.
  const pane = document.getElementById('alertsPane');
  const rpane = document.getElementById('ratesPane');
  const list = document.getElementById('list');

  // Rates is a form, not a list of jobs — same treatment as Alerts.
  if(v === 'rates'){
    document.getElementById('viewTitle').textContent = t('o.rates');
    document.getElementById('viewSub').textContent = '';
    f.innerHTML = '';
    list.classList.add('hide');
    pane.classList.add('hide');
    rpane.classList.remove('hide');
    renderRatesPane();
    return;
  }
  rpane.classList.add('hide');

  if(v === 'alerts'){
    // The banner exists to send an operator here. Once he has arrived it is
    // the same button twice, so it stands down.
    document.getElementById('pushBanner').innerHTML = '';
    document.getElementById('viewTitle').textContent = t('o.alerts');
    document.getElementById('viewSub').textContent = '';
    f.innerHTML = '';
    list.classList.add('hide');
    pane.classList.remove('hide');
    renderAlertsPane();
    return;
  }
  pane.classList.add('hide');
  list.classList.remove('hide');
  if(isTower) renderPushBanner();

  if(v === 'board'){
    document.getElementById('viewTitle').textContent = t('o.available_jobs');
    f.innerHTML = `
      <select id="fService" onchange="load()">
        <option value="">${t('o.all_services')}</option><option value="tow">${t('c.svc_tow')}</option>
        <option value="winch_recovery">${t('c.svc_winch')}</option><option value="lockout">${t('c.svc_lockout')}</option>
        <option value="jumpstart">${t('c.svc_jump')}</option><option value="tire_change">${t('c.svc_tire')}</option>
      </select>
      <select id="fRadius" onchange="load()">
        ${[15,25,35,50,100].map(n => `<option value="${n}" ${n===35?'selected':''}>${t('o.within',{n})}</option>`).join('')}
      </select>`;
  } else if(v === 'mine'){
    document.getElementById('viewTitle').textContent = t('o.my_jobs');
    f.innerHTML = isTower ? '' : `<button class="btn go" onclick="openPost()">+ Post a call</button>`;
  } else {
    document.getElementById('viewTitle').textContent = 'My bids';
    f.innerHTML = '';
  }
  load();
}

async function load(){
  const list = document.getElementById('list');
  list.innerHTML = `<div class="empty">Loading…</div>`;
  let res;

  if(VIEW === 'board'){
    const s = document.getElementById('fService')?.value || '';
    const r = document.getElementById('fRadius')?.value || 35;
    res = await api(`/calls/board?radius=${r}` + (s ? `&service_type=${s}` : ''));
    renderNotices(res);
  } else if(VIEW === 'mine'){
    res = await api('/calls/my-calls');
  } else {
    res = await api('/bids/mine');
    return renderBids(res.bids || []);
  }

  if(!res.success){ list.innerHTML = `<div class="notice err">${res.error}</div>`; return; }
  DATA = res.calls || [];
  // Location sharing follows the job list: it starts when a live job appears
  // and stops on its own when there isn't one.
  if(typeof syncDriverSharing === 'function') syncDriverSharing();
  document.getElementById('viewSub').textContent =
    (VIEW === 'board' && res.search)
      ? t(DATA.length === 1 ? 'o.job_within' : 'o.jobs_within', {n: DATA.length, r: res.search.radius_miles})
      : DATA.length + ' ' + t('c.jobs');
  render();
}

function renderNotices(res){
  const n = document.getElementById('notices');
  n.innerHTML = (res.can_accept === false && res.blocked_reason)
    ? `<div class="notice warn"><b>${t('o.cannot_accept')}</b> ${res.blocked_reason}</div>` : '';
}

// Which price breakdowns the operator has open. Survives a redraw, because
// losing it mid-read is exactly what made the panel feel broken.
const OPEN_BREAKDOWNS = new Set();
function rememberBreakdown(el){
  const id = el.dataset.call;
  if(el.open) OPEN_BREAKDOWNS.add(id); else OPEN_BREAKDOWNS.delete(id);
}

// Rewrite only the countdown text and its urgency colour. The deadline was
// frozen at render time from the server's own expires_in_sec — deriving it from
// the timestamp here would read a UTC value as local time and show 0:00 on a
// job with twenty minutes left.
function tickTimers(){
  if(!ME) return;
  document.querySelectorAll('.timer[data-deadline]').forEach(el => {
    const secs = Math.max(0, (Number(el.dataset.deadline) - Date.now())/1000);
    const t = el.querySelector('.t');
    if(t) t.textContent = Math.floor(secs/60) + ':' + String(Math.floor(secs%60)).padStart(2,'0');
    el.classList.toggle('crit', secs < 300);
    el.classList.toggle('warn', secs >= 300 && secs < 600);
    const card = el.closest('.call');
    if(card) card.classList.toggle('urgent', secs < 300);
  });
}

function render(){
  const list = document.getElementById('list');
  if(!DATA.length){
    list.innerHTML = `<div class="empty"><h3>${t('o.nothing')}</h3>
      <p>${VIEW==='board' ? t('o.nothing_sub') : t('o.nothing_mine')}</p></div>`;
    return;
  }
  const isTower = ME.account.account_type === 'tower';
  list.innerHTML = DATA.map(c => {
    const secs = c.expires_in_sec ?? Math.max(0, (new Date(c.expires_at.replace(' ','T')) - new Date())/1000);
    const mins = Math.floor(secs/60), ss = String(Math.floor(secs%60)).padStart(2,'0');
    const tcls = secs < 300 ? 'crit' : secs < 600 ? 'warn' : '';
    const open = c.status === 'open';
    const net  = c.tower_net_estimate ?? (c.offer_amount - feeOn(c.offer_amount));
    const flags = [
      !c.has_keys && t('o.flag_nokeys'), !c.wheels_lock && t('o.flag_wheels'),
      c.is_accident && t('o.flag_accident'), c.is_underground && t('o.flag_under'),
      c.is_ev && t('o.flag_ev'), c.needs_flatbed && t('o.flag_flatbed')
    ].filter(Boolean);

    return `<div class="call ${open && secs<300 ? 'urgent' : ''} ${!open ? 'mine' : ''}" data-call="${c.id}">
      <div class="c-main">
        <div class="c-top">
          <span class="svc ${c.service_type}">${t('svc.' + c.service_type)}</span>
          <span class="cnum">${c.call_number}</span>
          ${open ? `<span class="funded">&#9679; ${t('o.paid_job')}</span>` : `<span class="cnum">${c.status.replace('_',' ')}</span>`}
          ${c.surge_active ? `<span class="surge">${Number(c.surge_multiplier).toFixed(2)}x ${t('o.high_demand')}</span>` : ''}
        </div>
        <div class="route">
          ${c.pickup_area || (c.pickup_city + ', ' + c.pickup_state)}
          ${c.dropoff_city ? `<span class="arrow">&rarr;</span> ${c.dropoff_city}, ${c.dropoff_state}` : ''}
          ${c.tow_miles ? `<span class="miles">${t('o.mi_tow', {n: c.tow_miles})}</span>` : ''}
        </div>
        <div class="meta">
          <span>${c.vehicle || 'Vehicle n/a'}${c.vehicle_color ? ' &middot; ' + c.vehicle_color : ''}</span>
          <span>${c.customer_name || ''}</span>

          ${c.tower_name ? `<span>${c.tower_name}</span>` : ''}
          ${flags.length ? `<span class="flag">${flags.join(' &middot; ')}</span>` : ''}
        </div>

        ${isTower && c.lines && c.lines.length ? `
        <details class="bd" data-call="${c.id}" ${OPEN_BREAKDOWNS.has(String(c.id)) ? 'open' : ''}
                 ontoggle="rememberBreakdown(this)">
          <summary>${t('o.breakdown')}</summary>
          ${c.lines.map(l => `<div class="bl"><span>${l.label}</span><b>${money(l.amount)}</b></div>`).join('')}
          <div class="bl tot"><span>${t('o.job_total')}</span><b>${money(c.offer_amount)}</b></div>
          <div class="bl fee"><span>${t('o.platform_fee')}</span><b>&minus;${money(c.platform_fee_estimate)}</b></div>
          <div class="bl net"><span>${t('o.you_get')}</span><b>${money(net)}</b></div>
        </details>` : ''}
      </div>
      <div class="c-side">
        ${c.distance_miles != null ? `<div class="dist">${c.distance_miles}<br><span style="color:var(--ink-faint);font-weight:400">${t('o.miles')}</span></div>` : ''}
        ${open ? `<div class="timer ${tcls}" data-deadline="${Date.now() + secs * 1000}"><div class="t">${mins}:${ss}</div><div class="l">${t('o.left')}</div></div>` : ''}
        <div class="pay">
          <div class="amt">${money(c.offer_amount)}</div>
          ${isTower ? `<div class="net">${money(net)} ${t('o.to_you')}</div>` : ''}
          ${c.pricing_mode === 'bid' ? `<div class="mode">Bidding &middot; ${c.bid_count||0}</div>` : ''}
        </div>
        <div class="act">
          ${isTower && open
            ? (c.pricing_mode === 'bid'
                ? `<button class="btn ${c.already_bid?'ghost':'go'}" onclick="openAct(${c.id},'bid')">${c.already_bid?'Update bid':'Place bid'}</button>`
                : `<button class="btn go" onclick="openAct(${c.id},'accept')">${t('o.accept')}</button>`)
            : ''}
          ${isTower && !open && ['awarded','en_route','on_scene','in_progress'].includes(c.status)
            ? `<button class="btn green" onclick="advance(${c.id},'${c.status}','${c.service_type}')">${nextLabel(c.status, c.service_type)}</button>` : ''}
          ${!isTower && open ? `<button class="btn ghost" onclick="cancelCall(${c.id})">${t('o.cancel')}</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderBids(bids){
  document.getElementById('viewSub').textContent = bids.length + ' bids';
  const list = document.getElementById('list');
  if(!bids.length){ list.innerHTML = `<div class="empty"><h3>No bids yet</h3></div>`; return; }
  list.innerHTML = bids.map(b => `<div class="call">
    <div class="c-main">
      <div class="c-top"><span class="cnum">${b.call_number}</span>
        <span class="svc">${t('svc.' + b.service_type)}</span>
        <span class="cnum">${b.status}</span></div>
      <div class="route">${b.pickup_city}, ${b.pickup_state}</div>
      <div class="meta"><span>${b.provider_name}</span><span>ETA ${b.eta_minutes} min</span></div>
    </div>
    <div class="c-side"><div class="pay">
      <div class="amt">${money(b.amount)}</div>
      <div class="net">asking &middot; posted at ${money(b.offer_amount)}</div>
    </div></div></div>`).join('');
}

// A tow has one more step than a jump start: the stretch with the car on the
// back. Only tows get it — "Towing" on a lockout would be nonsense, and the
// customer's timeline is built from the same rule.
const towSteps = svc => svc === 'tow'
  ? {awarded:'en_route', en_route:'on_scene', on_scene:'in_progress', in_progress:'complete'}
  : {awarded:'en_route', en_route:'on_scene', on_scene:'complete'};

const nextLabel = (cur, svc) => ({
  en_route: t('o.enroute'), on_scene: t('o.onscene'),
  in_progress: t('o.towing'), complete: t('o.complete'),
}[towSteps(svc)[cur]] || t('o.complete'));

async function advance(id, cur, svc){
  const next = towSteps(svc)[cur];
  if(next === 'complete'){
    const r = await api('/calls/complete', {method:'POST', body:JSON.stringify({call_id:id})});
    if(!r.success) return alert(r.error);
    alert(t('o.completed_msg', {amount: money(r.net_to_you)}));
  } else {
    const r = await api('/calls/status', {method:'POST', body:JSON.stringify({call_id:id, status:next})});
    if(!r.success) return alert(r.error);
  }
  load();
}
async function cancelCall(id){
  if(!confirm('Cancel this call? Held funds return to your balance.')) return;
  const r = await api('/calls/cancel', {method:'POST', body:JSON.stringify({call_id:id})});
  if(!r.success) return alert(r.error);
  await refreshWallet(); load();
}

/* ── post a call ───────────────────────────────────────────────── */
function openPost(){ document.getElementById('postModal').classList.add('on'); renderCost(); }
function closePost(){ document.getElementById('postModal').classList.remove('on'); }
function renderCost(){
  const a = Number(document.getElementById('pAmount').value || 0);
  document.getElementById('costNote').innerHTML =
    `Holds <b>${money(a)}</b> from your balance until the call closes`;
}
async function submitCall(){
  const err = document.getElementById('postErr'); err.classList.add('hide');
  const body = {
    service_type: pService.value, vehicle_class: pClass.value,
    pickup_address: pPickup.value, pickup_city: pCity.value, pickup_state: pState.value,
    // Geocoding is wired to the address field in the live build; until then
    // the form seeds Miami coordinates so distances render correctly.
    pickup_lat: 25.7617, pickup_lng: -80.1918,
    dropoff_address: pDrop.value || null,
    dropoff_city: pDrop.value ? 'Hialeah' : null, dropoff_state: pDrop.value ? 'FL' : null,
    dropoff_lat: pDrop.value ? 25.8576 : null, dropoff_lng: pDrop.value ? -80.2781 : null,
    vehicle_year: pYear.value, vehicle_make: pMake.value, vehicle_model: pModel.value,
    has_keys: pKeys.checked, wheels_lock: pWheels.checked,
    is_accident: pAccident.checked, is_ev: pEV.checked,
    customer_name: pCName.value, customer_phone: pCPhone.value,
    pricing_mode: pMode.value, offer_amount: Number(pAmount.value),
    goa_amount: Number(pGoa.value), expires_in_minutes: Number(pExpiry.value)
  };
  const r = await api('/calls/create', {method:'POST', body:JSON.stringify(body)});
  if(!r.success){ err.textContent = r.error; err.classList.remove('hide'); return; }
  closePost(); await refreshWallet(); load();
}

/* ── accept / bid ──────────────────────────────────────────────── */
let ACT = null;
function openAct(id, mode){
  ACT = {id, mode};
  const c = DATA.find(x => x.id === id);
  document.getElementById('actTitle').textContent = t('o.accept_job');
  document.getElementById('actGo').textContent    = t('o.accept');
  document.getElementById('actSummary').innerHTML =
    `<div style="font-size:15px;font-weight:600;margin-bottom:4px">${c.pickup_area}${c.dropoff_city?' → '+c.dropoff_city:''}</div>
     <div style="color:var(--ink-dim);font-size:13px">${c.vehicle} &middot; ${c.service_type.replace('_',' ')} &middot; posted at ${money(c.offer_amount)}</div>`;
  document.getElementById('bidAmtWrap').style.display  = mode === 'bid' ? '' : 'none';
  document.getElementById('bidNoteWrap').style.display = mode === 'bid' ? '' : 'none';
  document.getElementById('actAmount').value = c.offer_amount;
  document.getElementById('actErr').classList.add('hide');
  renderActNet();
  document.getElementById('actModal').classList.add('on');
}
function closeAct(){ document.getElementById('actModal').classList.remove('on'); }
function renderActNet(){
  const c = DATA.find(x => x.id === ACT.id);
  const amt = ACT.mode === 'bid' ? Number(document.getElementById('actAmount').value||0) : c.offer_amount;
  // Fixed-price accepts use the server's figure; a typed bid can only be
  // estimated client-side, and the real number is confirmed on submit.
  const fee = (ACT.mode === 'accept' && c.platform_fee_estimate != null)
                ? c.platform_fee_estimate : feeOn(amt);
  document.getElementById('actNet').innerHTML =
    `${t('o.you_receive')} <b>${money(amt-fee)}</b> &nbsp;<span style="opacity:.7">${t('o.less_fee', {total: money(amt), fee: money(fee)})}</span>`;
}
async function submitAct(){
  const err = document.getElementById('actErr'); err.classList.add('hide');
  const eta = Number(document.getElementById('actEta').value);
  let r;
  if(ACT.mode === 'bid'){
    r = await api('/bids/create', {method:'POST', body:JSON.stringify({
      call_id: ACT.id, amount: Number(document.getElementById('actAmount').value),
      eta_minutes: eta, note: document.getElementById('actNote').value })});
  } else {
    r = await api('/calls/accept', {method:'POST', body:JSON.stringify({call_id: ACT.id, eta_minutes: eta})});
  }
  if(!r.success){ err.textContent = r.error; err.classList.remove('hide'); return; }
  closeAct();
  if(ACT.mode === 'accept') alert(`${t('o.job_yours')}\n\n${r.customer_name} — ${r.customer_phone}\n${r.pickup_address}`);
  load();
}

// A stale board is a lost call, so refresh on a timer and tick the countdowns.
/* ── Polling, and realtime on top of it ───────────────────────────────────
   The interval never stops. When a socket is connected it stretches out; when
   the socket drops it snaps back. A realtime layer that REPLACED polling would
   put a new moving part between a stranded customer and a truck, and the
   failure would be silent — an operator staring at a board that stopped
   updating half an hour ago and looks completely normal. */
let BOARD_POLL_MS = 20000;
let boardTimer = setInterval(boardTick, BOARD_POLL_MS);

function boardTick(){ if(ME && VIEW === 'board') load(); }

function setBoardPoll(ms){
  if(ms === BOARD_POLL_MS) return;
  BOARD_POLL_MS = ms;
  clearInterval(boardTimer);
  boardTimer = setInterval(boardTick, BOARD_POLL_MS);
}

// Called by realtime.js on connect/disconnect.
function onRealtimeUp(){   setBoardPoll(120000); }
function onRealtimeDown(){ setBoardPoll(20000);  }

// Every handler refetches rather than trusting the payload. The socket says
// what changed; the API decides what this operator may see.
function startRealtime(){
  if(!ME || typeof TLRealtime === 'undefined') return;
  TLRealtime.connect({ token: TOKEN }, {
    'job.posted':  () => { if(VIEW === 'board') load(); },
    'job.closed':  () => { if(VIEW === 'board') load(); },
    'job.changed': () => load(),
  });
}

// Countdowns tick in place. This used to call render(), which rebuilt every
// card once a second — so an operator who opened the price breakdown watched it
// slam shut within a second, every time. Nothing else on a card changes between
// server refreshes, so nothing else needs redrawing.
setInterval(tickTimers, 1000);

</script>
