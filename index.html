<!-- ─── Installable app ──────────────────────────────────────────────────
     iOS reads none of the manifest's display or icon fields; it needs its own
     apple-* tags, and without apple-mobile-web-app-capable the Home Screen
     icon opens a plain Safari tab — which cannot receive push at all. -->
<link rel="manifest" href="manifest.json?v=20260818p">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TowSling">
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1b232d; --line:#242e3a;
  --ink:#e6edf3; --ink-dim:#8b98a8; --ink-faint:#5d6b7d;
  --accent:#ff7a18; --accent-dim:#c25a0e;
  --green:#2ea043; --green-dim:#1a6b2c; --red:#e5534b; --amber:#d29922; --blue:#4a9eff;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;border-radius:6px}
input,select{font:inherit}

/* ── shell ─────────────────────────────────────────────────────── */
header{
  display:flex;align-items:center;gap:20px;padding:0 20px;height:56px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.3px}
/* The logo on a light tile, exactly the role the orange square used to play.
   The artwork's lower half is a near-black navy, and dropped straight onto
   this header (#151b23) the bottom of both letters disappears into the
   background — at 26px it reads as a smudge. The tile is not decoration, it
   is what makes the mark legible on a dark chrome. */
.logo .mark{
  height:28px;width:auto;display:block;
  background:#fff;border-radius:6px;padding:3px 5px;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{
  padding:7px 14px;border-radius:6px;background:transparent;color:var(--ink-dim);
  font-weight:500;transition:.12s;
}
.tab:hover{color:var(--ink);background:var(--panel-2)}
.tab.on{background:var(--panel-2);color:var(--ink)}
.spacer{flex:1}
.whoami{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-dim)}
.badge{
  padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;
}
.badge.provider{background:rgba(74,158,255,.14);color:var(--blue)}
.badge.tower{background:rgba(255,122,24,.14);color:var(--accent)}
.wallet{
  padding:5px 12px;border-radius:6px;background:var(--panel-2);
  border:1px solid var(--line);font-variant-numeric:tabular-nums;
}
.wallet b{color:var(--green)}
.wallet .held{color:var(--amber)}

main{max-width:1400px;margin:0 auto;padding:22px 20px 60px}

/* ── board ─────────────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:20px;font-weight:650;letter-spacing:-.3px}
.sub{color:var(--ink-faint);font-size:13px}
.filters{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.filters select,.filters input{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:7px 11px;border-radius:6px;outline:none;
}
.filters select:focus,.filters input:focus{border-color:var(--accent)}

.cards{display:grid;gap:10px}
.call{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;display:grid;
  grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;
  transition:.14s;
}
.call:hover{border-color:#33404f;background:var(--panel-2)}
/* ── full-size photo viewer ──────────────────────────────── */
#lightbox{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(3,6,11,.94);
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
  padding:20px;
}
#lightbox.on{display:flex}
#lbImg{
  max-width:100%;max-height:80vh;object-fit:contain;
  border-radius:12px;border:1px solid var(--line);
  /* The thumbnail is cropped square; this is the real photograph. */
}
.lb-cap{font-size:14px;font-weight:650;color:var(--ink-dim);text-align:center}
.lb-x{
  position:absolute;top:14px;right:16px;width:42px;height:42px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font-size:24px;line-height:1;cursor:pointer;
}
.pthumb{cursor:zoom-in}

/* ── job photos ─────────────────────────────────────────── */
.photos{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.photos summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;
  font-size:13px;font-weight:700;color:var(--ink-dim);padding:4px 0;user-select:none;
}
.photos summary::-webkit-details-marker{display:none}
.pcount{
  font-size:11.5px;font-weight:800;border-radius:20px;padding:2px 9px;
  border:1px solid;font-variant-numeric:tabular-nums;
}
.pcount.ok{color:#7ee2a0;border-color:#1a6b2c;background:#0f2417}
.pcount.warn{color:#f0c674;border-color:#7c5a10;background:#241d0d}
.pwarn{
  font-size:12.5px;line-height:1.5;color:#f0c674;background:#241d0d;
  border:1px solid #7c5a10;border-radius:9px;padding:10px 12px;margin:8px 0 4px;
}
.pgroup{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  color:var(--ink-faint);margin:12px 0 4px}
.pshot{
  display:flex;align-items:center;gap:11px;cursor:pointer;
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;
  background:var(--panel-2);
}
.pshot.on{border-color:#1a6b2c;background:#0f2417}
.pshot.extra{border-style:dashed;margin-top:10px}
.pshot.extra.goa{border-color:#7c5a10}
.pshot .pmark{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:800;background:var(--line);color:var(--ink-dim);
}
.pshot.on .pmark{background:var(--green);color:#fff}
.pshot .ptxt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.pshot .ptxt b{font-size:13.5px;color:var(--ink);font-weight:700}
.pshot .ptxt small{font-size:11.5px;color:var(--ink-faint);line-height:1.4}
.pthumb{
  flex:none;width:44px;height:44px;border-radius:8px;object-fit:cover;
  border:1px solid var(--line);
}
.pnote{font-size:12.5px;color:var(--ink-dim);margin-top:8px;min-height:1em}
.pnote.bad{color:var(--red)}

.addr{
  display:flex;align-items:flex-start;gap:8px;margin-top:6px;
  font-size:13px;color:var(--ink-2);line-height:1.45;
}
.addr .pin{
  flex:none;width:17px;height:17px;border-radius:50%;margin-top:1px;
  display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;
}
/* history filter bar */
.hfind{
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);padding:8px 12px;font-size:13.5px;min-width:190px;
}
.hfind::placeholder{color:var(--ink-faint)}
.bar input[type=date]{
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  color:var(--ink-dim);padding:7px 10px;font-size:13px;
}

.addr .maplink{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.addr .maplink:hover{color:var(--accent)}
.addr .pin.up{background:#2563eb}
.addr .pin.down{background:#7c3aed}

.problem{
  font-size:13px;font-weight:650;color:#f0b429;margin-top:6px;
  display:inline-block;background:#241d0d;border:1px solid #6b4f0f;
  border-radius:7px;padding:3px 9px;
}
.call.urgent{border-left:3px solid var(--red)}
.call.mine{border-left:3px solid var(--green)}

.c-main{min-width:0}
.c-top{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.svc{
  padding:3px 9px;border-radius:5px;background:rgba(255,122,24,.13);
  color:var(--accent);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;
}
.svc.lockout{background:rgba(74,158,255,.13);color:var(--blue)}
.svc.winch_recovery{background:rgba(229,83,75,.13);color:var(--red)}
.cnum{color:var(--ink-faint);font-size:12px;font-variant-numeric:tabular-nums}
.funded{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  color:var(--green);background:rgba(46,160,67,.11);padding:3px 8px;border-radius:5px;
}
.route{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;margin-bottom:5px}
.route .arrow{color:var(--ink-faint);font-weight:400}
.route .miles{
  font-size:12px;font-weight:600;color:var(--ink-dim);background:var(--panel-2);
  padding:2px 8px;border-radius:5px;border:1px solid var(--line);
}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-dim);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.flag{color:var(--amber);font-weight:600;font-size:12px}

/* High demand. Shown to the operator with the multiplier, because they are
   deciding whether to roll; the customer only ever sees one price. */
.surge{
  background:#3b2d12;color:#fbbf24;border-radius:999px;
  padding:2px 8px;font-size:11px;font-weight:750;letter-spacing:.2px;
}

/* ── itemised job breakdown (operators only) ──────────────
   The customer sees one number. A driver decides on whether the money covers
   22 miles and a winch, so they get every line and the net after the fee. */
.bd{margin-top:11px}
.bd summary{
  cursor:pointer;color:var(--ink-2);font-size:12.5px;font-weight:650;
  list-style:none;padding:5px 0;user-select:none;
}
.bd summary::-webkit-details-marker{display:none}
.bd summary::before{content:'▸ ';color:var(--ink-faint)}
.bd[open] summary::before{content:'▾ '}
.bl{
  display:flex;justify-content:space-between;gap:14px;
  padding:5px 0 5px 14px;font-size:12.5px;color:var(--ink-2);
}
.bl b{color:var(--ink);font-weight:650;white-space:nowrap}
.bl.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:8px;font-weight:700;color:var(--ink)}
.bl.fee b{color:var(--ink-faint)}
.bl.net{font-weight:750;color:var(--green,#22c55e)}
.bl.net b{color:var(--green,#22c55e)}

/* ── driver location sharing ──────────────────────────────
   Deliberately visible. A driver who cannot see that his location is being
   sent, and cannot stop it in one tap, will solve the problem by logging out —
   and then he stops getting jobs too. */
.share-bar{
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);background:var(--panel-2);
  border-radius:12px;padding:12px 15px;margin-bottom:14px;
}
.share-bar.on{border-color:#14532d;background:#0e1a13}
.share-bar.off{border-color:#7c5a10;background:#241d0d}
.share-bar b{font-size:13px;font-weight:700}
.share-bar > div{flex:1;min-width:0}
.share-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.share-bar .btn{flex:none;padding:6px 12px;font-size:12px}

/* ── push alerts ──────────────────────────────────────────
   Same visual family as the verification banner on purpose: both are "you
   cannot earn until you finish this", and an operator should read them the
   same way. */
.push-bar{
  border:1px solid var(--line);background:var(--panel-2);border-radius:12px;
  padding:15px 17px;margin-bottom:18px;
}
.push-bar.warn{border-color:#7c5a10;background:#241d0d}
.push-bar.err{border-color:#7f1d1d;background:#221010}
.push-bar h4{font-size:14px;font-weight:750;margin-bottom:5px;color:#fbbf24}
.push-bar.err h4{color:#f0776f}
.push-bar p{font-size:13px;color:var(--ink-dim);line-height:1.6;margin-bottom:0}
.push-bar .btn{margin-top:12px}
/* App Store / Play button. Apple's real badge is a licensed image; this is the
   same shape drawn in CSS so the shell stays self-contained and offline-safe. */
.store-btn{
  display:inline-flex;align-items:center;gap:10px;margin-top:14px;
  background:#000;color:#fff;border:1px solid #3a3a3c;border-radius:10px;
  padding:9px 16px 9px 13px;text-decoration:none;line-height:1.15;
}
.store-btn:hover{background:#151517;border-color:#5a5a5e}
.store-btn .store-txt{display:flex;flex-direction:column}
.store-btn small{font-size:10.5px;letter-spacing:.02em;opacity:.9}
.store-btn b{font-size:17px;font-weight:650;letter-spacing:-.2px}

.push-steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
.push-steps li{
  display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);
  padding:7px 0;line-height:1.4;
}
.push-steps .sq{
  flex:none;width:26px;height:26px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--blue);font-weight:700;font-size:14px;
}
.push-fine{font-size:11.5px;color:var(--ink-faint);line-height:1.55;margin-top:9px}
.push-fine.err-text{color:#f0776f}
.warn-text{color:#e3b341}

.pane{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin-bottom:14px;overflow:hidden;
}
.pane-h{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);
}
.pane-h h3{font-size:13px;font-weight:700;letter-spacing:.2px}
.pane-status{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:7px}
.pane-b{padding:16px}
.pane-b .btn{margin-top:6px;margin-right:8px}
.pane-b .f{margin-bottom:15px}
.pane-b .f label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px}
.pane-b .f input,.pane-b .f select{
  /* Capped rather than full-width: a number field stretched across a 1400px
     desktop reads as a text area and invites a paragraph. */
  width:100%;max-width:340px;padding:9px 11px;border-radius:7px;background:var(--bg);
  border:1px solid var(--line);color:var(--ink);
}
.pane-b .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px}
.pane-b .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;line-height:1.5}
.pane-b .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:16px}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--ink-faint)}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(46,160,67,.15)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(210,153,34,.15)}
.dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(229,83,75,.15)}

.device{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.device:last-child{border-bottom:0}
.device .dot{margin-top:5px}
.device-t{font-size:13px;font-weight:600;text-transform:capitalize}

/* Running full screen from the Home Screen there is no browser chrome, so the
   header sits under the notch unless it is padded out of the safe area. */
@supports (padding:env(safe-area-inset-top)){
  header{
    height:calc(56px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
  }
}

/* ── verification banner ──────────────────────────────── */
.verify-bar{
  border:1px solid #7c5a10;background:#241d0d;border-radius:12px;
  padding:15px 17px;margin-bottom:18px;
}
.verify-bar.ok{border-color:#14532d;background:#0e1a13}
.verify-bar h4{font-size:14px;font-weight:750;margin-bottom:5px;color:#fbbf24}
.verify-bar.ok h4{color:#4ade80}
.verify-bar p{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:0}
.verify-bar .vb-act{margin-top:12px}
.vdocs{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.vdocs-wrap{margin-top:14px}
.vdocs-wrap summary{
  cursor:pointer;list-style:none;font-size:12.5px;font-weight:700;
  color:var(--ink-dim);padding:6px 0;user-select:none;
}
.vdocs-wrap summary::-webkit-details-marker{display:none}
.vdocs-wrap summary::before{content:'▸ ';color:var(--ink-faint)}
.vdocs-wrap[open] summary::before{content:'▾ '}
.vrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .vm{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
}
.vrow.have .vm{background:#16a34a;border-color:#16a34a;color:#04140a}
.vrow .vi{flex:1;min-width:0}
.vrow .vi b{display:block;font-size:13px;font-weight:700}
.vrow .vi small{font-size:11.5px;color:var(--ink-faint)}
.vbtn{
  background:var(--ink);color:var(--bg,#0c1017);border-radius:8px;padding:7px 11px;
  font-size:12.5px;font-weight:700;cursor:pointer;flex:none;
}
.vrow input[type=date]{width:auto;padding:6px 8px;font-size:12px;flex:none}

.c-side{display:flex;align-items:center;gap:18px}
.pay{text-align:right}
.pay .amt{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pay .net{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.pay .mode{
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;
  color:var(--blue);margin-top:2px;
}
.timer{
  text-align:center;min-width:62px;font-variant-numeric:tabular-nums;
}
.timer .t{font-size:16px;font-weight:700;color:var(--green)}
.timer.warn .t{color:var(--amber)}
.timer.crit .t{color:var(--red)}
.timer .l{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px}
.act{display:flex;flex-direction:column;gap:6px;min-width:104px}
.btn{padding:9px 16px;font-weight:650;font-size:13px;transition:.12s}
.btn.go{background:var(--accent);color:#0d1117}
.btn.go:hover{background:#ff8c38}
.btn.ghost{background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:#33404f}
.btn.green{background:var(--green);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed}
.dist{
  font-size:12px;color:var(--ink-dim);text-align:center;font-weight:600;
  font-variant-numeric:tabular-nums;
  /* "miles away" is one phrase and breaks as one.
     .c-side is a flex row, and without flex:none this cell gets squeezed to
     the width of its longest word — on a phone that rendered as three stacked
     lines, "4.3" over "miles" over "away", which reads like three separate
     labels rather than one distance. */
  white-space:nowrap;
  flex:none;
}
/* Spanish says "millas de distancia" where English says "miles away", and on
   one line that is 98px — enough to push the Accept button clean off a 390px
   screen, which is the same bug that hid Sign out in the header. So Spanish
   wraps inside a capped width instead. The cap has to sit alongside flex:none:
   without it the cell collapses to the width of the longest word and stacks
   every word on its own line. i18n.js keeps <html lang> in step with the
   chosen language, so this switches with it. */
html[lang="es"] .dist{
  white-space:normal;
  max-width:9ch;
}

.empty{
  text-align:center;padding:70px 20px;color:var(--ink-faint);
  background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
}
.empty h3{font-size:16px;color:var(--ink-dim);margin-bottom:6px;font-weight:600}

.notice{
  padding:12px 16px;border-radius:var(--radius);margin-bottom:14px;font-size:13px;
  display:flex;align-items:center;gap:10px;
}
.notice.warn{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);color:#e3b341}
.notice.err{background:rgba(229,83,75,.1);border:1px solid rgba(229,83,75,.3);color:#f0776f}
.notice.ok{background:rgba(46,160,67,.1);border:1px solid rgba(46,160,67,.3);color:#56d364}

/* ── forms / modal ─────────────────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px;font-weight:600}
.f input,.f select{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  padding:9px 11px;border-radius:6px;outline:none;
}
.f input:focus,.f select:focus{border-color:var(--accent)}
.f{margin-bottom:14px}
fieldset{border:none;margin-bottom:16px}
legend{
  font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);
  font-weight:700;margin-bottom:12px;
}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;color:var(--ink-dim);cursor:pointer;font-size:13px}
.chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;
  align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;overflow:auto;
}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:720px}
.modal-h{
  padding:18px 22px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-h h2{font-size:17px;font-weight:650}
.modal-b{padding:22px}
.modal-f{
  padding:16px 22px;border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;align-items:center;
}
.x{background:transparent;color:var(--ink-faint);font-size:22px;line-height:1;padding:0 6px}
.x:hover{color:var(--ink)}

.cost{
  margin-right:auto;font-size:13px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;
}
.cost b{color:var(--ink)}

/* ── login ─────────────────────────────────────────────────────── */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:400px}
.login .brand{text-align:center;margin-bottom:26px}
/* No white tile here any more.
   The tile existed because the old mark's lower half was a near-black navy
   that vanished into the dark panel behind it. The orange artwork has its own
   contrast and a transparent background, so a white card around it now reads
   as a sticker stuck on the page rather than as the brand. */
.login .brand .mark{
  height:64px;width:auto;display:block;margin:0 auto 14px;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.45));
}
.login .brand h1{font-size:24px;letter-spacing:-.5px;margin-bottom:5px}
.login .brand p{color:var(--ink-faint);font-size:13px}
.hide{display:none !important}

@media(max-width:820px){
  .call{grid-template-columns:1fr}
  /* 18px between four cells (distance, timer, price, Accept) is 54px of the
     ~360px a phone actually has. Tightening it to 10px is what keeps the
     Accept button on screen once the distance label carries a real phrase
     rather than a single word — and leaves room for a two-digit distance. */
  .c-side{justify-content:space-between;gap:10px}
  .grid2,.grid3{grid-template-columns:1fr}

  /* The tabs used to be hidden at this width, from when a tower had only two
     of them and the board was always the one you wanted. Alerts changed that:
     it is the screen an operator most needs to reach, and he is only ever on a
     phone. Hidden tabs would have made it unreachable on the one device that
     matters. Wrapped onto their own scrollable row instead. */
  header{
    height:auto;flex-wrap:wrap;gap:0 14px;padding:9px 14px;
    padding-top:calc(9px + env(safe-area-inset-top, 0px));
  }
  .tabs{
    display:flex;order:9;width:100%;margin:9px 0 0;gap:4px;
    overflow-x:auto;scrollbar-width:none;
    border-top:1px solid var(--line);padding-top:9px;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 15px;font-size:13px;white-space:nowrap;flex:none}

  /* Sign out was off the right edge of the screen and unreachable.
     The header's first row was carrying the logo, the duty switch, the company
     name, the account badge, the language button AND sign out. A name like
     "R&M Towing & Recovery" pushed the last item past the viewport, and since
     nothing wrapped there was no way to scroll to it either — the button
     existed but could not be pressed on a phone.

     Row 1 keeps the logo and the duty switch, which is the control an operator
     touches several times a day. Everything else drops to its own row, and the
     company name truncates instead of shoving its neighbours off the screen. */
  .whoami{
    order:8;width:100%;justify-content:flex-end;flex-wrap:wrap;
    gap:8px;margin-top:9px;min-width:0;
  }
  #dutyBtn{order:-1;margin-right:auto}
  #acctName{
    min-width:0;max-width:46vw;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* The account-type badge is the one thing here a phone can do without: an
     operator knows what kind of account he has, and the duty switch and the
     tabs beside it say so anyway. Dropping it is what lets the name, the
     language button and sign out share a single line. */
  .whoami .badge{display:none}
  .spacer{display:none}

  .pane-b .f2{grid-template-columns:1fr}
}

/* rate sheet */
.rates{margin:14px 0 6px}
/* ── Company documents ─────────────────────────────────────────────────────
   The join page has its own copy of this on a light background. This is the
   dark-dashboard version; the mobile wrap is the same lesson learned there —
   the date box has a large intrinsic width and will crush the label unless it
   is given its own line. */
.docs{margin:14px 0 4px}
.docrow{display:flex;flex-wrap:wrap;align-items:center;gap:11px;
  padding:13px 0;border-top:1px solid var(--line)}
.docrow:first-child{border-top:none}
.docrow .dmark{width:22px;height:22px;border-radius:50%;flex:none;
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--ink-faint)}
.docrow.have .dmark{background:var(--green-dim);border-color:var(--green);color:#fff}
.docrow.bad .dmark{background:#3b1515;border-color:var(--red);color:#fff}
.docrow .dinfo{flex:1 1 140px;min-width:140px}
.docrow .dinfo b{display:block;font-size:14px;font-weight:700}
.docrow .dinfo small{font-size:12.5px;display:block;margin-top:2px;line-height:1.45}
.d-ok{color:var(--green)} .d-bad{color:var(--red)}
.d-pend{color:var(--amber)} .d-miss{color:var(--ink-faint)}
.docrow .dexp{order:3;flex:1 1 100%;margin-left:33px;box-sizing:border-box;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;color:var(--ink);font-size:13px}
.dbtn{display:inline-block;background:var(--panel-2);border:1px solid var(--line);
  color:var(--ink);border-radius:8px;padding:9px 14px;font-size:13px;
  font-weight:700;cursor:pointer;flex:none}
.dbtn:hover{border-color:var(--accent)}
.dstatus{margin-top:16px;padding:12px 14px;border-radius:8px;
  background:#241d0d;border:1px solid #7c5a10;color:#f0c674;font-size:13px;line-height:1.55}
.dstatus.go{background:#0f2417;border-color:var(--green-dim);color:#7ee2a0}
.notice-fix{display:inline-block;margin-left:8px;font-weight:700;color:var(--accent);
  text-decoration:underline;white-space:nowrap}
@media (min-width:560px){
  .docrow .dexp{order:0;flex:0 0 auto;margin-left:0;width:auto}
}

.rate-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--line)}
.rate-row:last-child{border-bottom:none}
.rate-name{flex:1 1 130px;font-weight:650;font-size:14.5px;padding-bottom:9px}
.rate-fields{display:flex;gap:9px;flex-wrap:wrap}
.rate-fields label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;
  font-weight:650;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px}
.rate-fields input{width:86px;padding:9px 10px;border-radius:9px;text-align:right;
  background:var(--panel-2);color:var(--ink);border:1px solid var(--line);outline:none}
.rate-fields input:focus{border-color:var(--accent)}
.rate-fields input::placeholder{color:var(--ink-faint)}

/* ── verification steps banner ─────────────────────────────────────
   Two moods. `blocked` is something the operator has to act on; `waiting` is
   the platform owing them an answer. They must not look the same — a company
   that has done everything and is waiting on review was being shown the same
   red alarm as one that had uploaded nothing, which reads as "you failed". */
.verify-steps{border-radius:10px;padding:14px 16px;margin-bottom:14px;border:1px solid}
.verify-steps.blocked{background:#241d0d;border-color:#7c5a10}
.verify-steps.waiting{background:#12202c;border-color:#1f4a6b}
.verify-steps h4{font-size:14px;font-weight:750;margin-bottom:3px}
.verify-steps.blocked h4{color:#f0c674}
.verify-steps.waiting h4{color:#7fc4f5}
.verify-steps .vs-sub{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-bottom:11px}
.vs-rows{display:grid;gap:7px}
.vs-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
  background:rgba(0,0,0,.22)}
.vs-mark{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:800;background:var(--panel-2);border:1px solid var(--line);
  color:var(--ink-faint)}
.vs-row.done .vs-mark{background:var(--green-dim);border-color:var(--green);color:#fff}
.vs-row.wait .vs-mark{background:#1f4a6b;border-color:#2f6f9e;color:#cfe8fb}
.vs-row.todo .vs-mark{background:#3b2f0d;border-color:#7c5a10;color:#f0c674}
.vs-text{flex:1 1 auto;min-width:0}
.vs-text b{display:block;font-size:13px;font-weight:700}
.vs-text small{display:block;font-size:12px;color:var(--ink-dim);margin-top:1px;line-height:1.45}
.vs-go{flex:none;font-size:12px;font-weight:700;color:var(--accent);text-decoration:underline;
  white-space:nowrap}

/* ── company page ──────────────────────────────────────────────── */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;
  margin-bottom:14px}
.cf{display:flex;flex-direction:column;gap:5px;min-width:0}
.cf > span{font-size:12px;color:var(--ink-dim)}
.cf input,.cf select{width:100%;padding:9px 11px;border-radius:7px;background:var(--panel-2);
  color:var(--ink);border:1px solid var(--line);outline:none}
.cf input:focus,.cf select:focus{border-color:var(--accent)}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:10px 0 14px}
.cap{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.cap input{accent-color:var(--accent)}
.pane-h .cnt{font-size:12px;color:var(--ink-faint);font-weight:600;margin-left:6px}

.truck{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 0;border-top:1px solid var(--line)}
.truck:first-child{border-top:none}
.tk-main{flex:1 1 180px;min-width:180px}
.tk-main b{display:block;font-size:14px;font-weight:700}
.tk-main small{display:block;font-size:12.5px;color:var(--ink-dim);margin-top:2px;line-height:1.45}
.tk-main .tk-eq{color:var(--ink-faint);font-size:12px}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn.danger{color:var(--red);border-color:#4a2320}
.tk-form{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel-2)}
.tk-form h4{font-size:13.5px;font-weight:750;margin-bottom:12px}

.vrowc{padding:12px 0;border-top:1px solid var(--line)}
.vrowc:first-child{border-top:none}
.vc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vc-head b{font-size:13.5px;font-weight:700}
.vc-val{font-size:12.5px;color:var(--ink-dim);flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.vc-state{font-size:12px;font-weight:700;color:var(--ink-faint);white-space:nowrap}
.vrowc.done .vc-state{color:var(--green)}
.vc-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.vc-code{width:104px;padding:8px 10px;border-radius:7px;background:var(--panel);
  color:var(--ink);border:1px solid var(--line);outline:none;text-align:center;
  letter-spacing:2px;font-weight:700}
.vc-code:focus{border-color:var(--accent)}

/* ── address suggestions, dark ─────────────────────────────────────
   Our own list rather than Google's component: theirs takes over the whole
   screen on a phone. */
.tl-ac{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  box-shadow:0 14px 34px rgba(0,0,0,.5);overflow:hidden;
}
.tl-ac[hidden]{display:none}
.tl-ac-item{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:10px 12px;background:none;border:none;border-top:1px solid var(--line);
  cursor:pointer;color:var(--ink);
}
.tl-ac-item:first-child{border-top:none}
.tl-ac-item:hover,.tl-ac-item.on{background:var(--panel)}
.tl-ac-pin{font-size:14px;line-height:1.35;flex:none;opacity:.7}
.tl-ac-txt{min-width:0}
.tl-ac-txt b{display:block;font-size:13.5px;font-weight:650;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-ac-txt small{display:block;font-size:12px;color:var(--ink-dim);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── duty switch ────────────────────────────────────────────────────
   Green when taking jobs, grey when not. The colour is the STATE, never the
   action — a control that shows what pressing it would do is a control people
   read backwards. */
.duty{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;
  font-size:12.5px;font-weight:700;border:1px solid;transition:.15s;white-space:nowrap;
  margin-right:10px;
}
.duty .dot{width:8px;height:8px;border-radius:50%;flex:none}
.duty.on{background:#0f2417;border-color:var(--green-dim);color:#7ee2a0}
.duty.on .dot{background:var(--green);box-shadow:0 0 0 3px rgba(46,160,67,.18)}
.duty.off{background:var(--panel-2);border-color:var(--line);color:var(--ink-dim)}
.duty.off .dot{background:var(--ink-faint)}
.duty:hover{filter:brightness(1.15)}
.duty:disabled{opacity:.55;cursor:wait}

/* ── toasts ────────────────────────────────────────────────────────
   Fixed to the viewport and hung off <body>, NOT off anything inside <main>.
   Every pane in there is replaced wholesale on re-render, so a confirmation
   written into one is wiped by the redraw that follows the action. */
.toasts{position:fixed;top:14px;right:14px;z-index:200;display:grid;gap:8px;
  width:min(380px,calc(100vw - 28px))}
.toast{padding:12px 15px;border-radius:9px;font-size:13.5px;font-weight:650;
  line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.45);
  animation:toastIn .18s ease-out}
.toast.ok{background:#0f2417;border:1px solid var(--green-dim);color:#7ee2a0}
.toast.bad{background:#3b1515;border:1px solid var(--red);color:#ff9b95}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ── money ─────────────────────────────────────────────────────── */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;
  margin-bottom:16px}
.mcard{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:14px}
.mcard span{display:block;font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;
  letter-spacing:.4px;font-weight:650}
.mcard b{display:block;font-size:22px;font-weight:800;letter-spacing:-.6px;margin:5px 0 3px}
.mcard small{display:block;font-size:11.5px;color:var(--ink-faint);line-height:1.45}
/* The one number they came to see. */
.mcard.big{border-color:var(--green-dim);background:#0f2417}
.mcard.big b{color:#7ee2a0;font-size:29px}

.mrows{display:grid}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
.mr-main{flex:1 1 auto;min-width:0}
.mr-main b{display:block;font-size:13.5px;font-weight:700}
.mr-main small{display:block;font-size:12px;color:var(--ink-dim);margin-top:2px}
.mr-amt{text-align:right;flex:none}
.mr-amt b{display:block;font-size:14.5px;font-weight:750}
.mr-amt small{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.wstat{font-size:11.5px;font-weight:750;padding:3px 8px;border-radius:20px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim)}
.wstat.paid{background:#0f2417;border-color:var(--green-dim);color:#7ee2a0}
.wstat.pending{background:#241d0d;border-color:#7c5a10;color:#f0c674}
.wstat.failed{background:#3b1515;border-color:var(--red);color:#ff9b95}

/* ── support ───────────────────────────────────────────────────── */
.cf textarea{width:100%;padding:9px 11px;border-radius:7px;background:var(--panel-2);
  color:var(--ink);border:1px solid var(--line);outline:none;resize:vertical;font:inherit}
.cf textarea:focus{border-color:var(--accent)}
.tickets{margin-top:16px;display:grid;gap:10px}
.ticket{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--panel-2)}
.tk-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.tk-h b{font-size:13.5px;font-weight:700;flex:1 1 auto;min-width:0}
.tk-ref{font-size:11.5px;color:var(--ink-faint);font-family:ui-monospace,Menlo,monospace}
.tk-st{font-size:11px;font-weight:750;padding:2px 8px;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-dim)}
.tk-st.answered{background:#0f2417;border-color:var(--green-dim);color:#7ee2a0}
.tk-st.open{background:#241d0d;border-color:#7c5a10;color:#f0c674}

<script>
const API = 'api';
let TOKEN = localStorage.getItem('tl_token') || '';
let ME = null, VIEW = 'board', DATA = [], FEE_PCT = 10, FEE_MIN = 5;
let VDOCS_OPEN = false;   // survives the re-render that follows a document upload

// Escapes anything that came from outside this file before it goes into
// innerHTML. Most strings on this page are from the server's own catalogue and
// are safe, but an API error message is not a fixed set, and a company name is
// typed by whoever signed up.
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

/* ── api ───────────────────────────────────────────────────────── */
async function api(path, opts={}){
  // Language rides along so API errors match the interface.
  const url = API + path + (path.includes('?') ? '&' : '?') + 'lang=' + tlLang();
  const r = await fetch(url, {
    ...opts,
    headers:{'Content-Type':'application/json', ...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{}), ...(opts.headers||{})}
  });
  return r.json();
}
const money = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const feeOn = a => Math.min(a, Math.max(FEE_MIN, Math.round(a*FEE_PCT)/100));

/* ── auth ──────────────────────────────────────────────────────── */
async function doLogin(){
  const err = document.getElementById('liErr');
  err.classList.add('hide');
  const res = await api('/auth/login', {method:'POST', body: JSON.stringify({
    email: document.getElementById('liEmail').value.trim(),
    password: document.getElementById('liPass').value
  })});
  if(!res.success){ err.textContent = res.error; err.classList.remove('hide'); return; }
  TOKEN = res.token; localStorage.setItem('tl_token', TOKEN);
  await boot();
}
async function logout(){
  // The session cookie the service worker uses lives on the server side of
  // this call. Clearing localStorage alone would leave a phone able to
  // re-register itself against an account its driver has signed out of.
  try { await api('/auth/logout', {method:'POST'}); } catch(e){}
  try { TLRealtime.disconnect(); } catch(e){}
  try { await TLPush.disable(); } catch(e){}
  TOKEN=''; localStorage.removeItem('tl_token'); location.reload();
}

async function boot(){
  const me = await api('/auth/me');
  if(!me.success){ TOKEN=''; localStorage.removeItem('tl_token');
    document.getElementById('loginView').classList.remove('hide');
    document.getElementById('appView').classList.add('hide'); return; }
  ME = me;
  document.getElementById('loginView').classList.add('hide');
  document.getElementById('appView').classList.remove('hide');
  document.getElementById('acctName').textContent = me.account.name;
  // Named badge, not `t` — a local `t` shadows the translation function and
  // every t('...') call in this scope becomes "t is not a function".
  const typeBadge = document.getElementById('acctType');
  typeBadge.textContent = me.account.account_type;
  typeBadge.className = 'badge ' + me.account.account_type;

  const isTower = me.account.account_type === 'tower';
  document.getElementById('tabs').innerHTML = isTower
    ? `<button class="tab" data-v="board">${t('o.available_jobs')}</button><button class="tab" data-v="mine">${t('o.my_jobs')}</button><button class="tab" data-v="history">${t('o.history')}</button><button class="tab" data-v="alerts">${t('o.alerts')}</button><button class="tab" data-v="rates">${t('o.rates')}</button><button class="tab" data-v="docs">${t('o.docs')}</button><button class="tab" data-v="money">${t('o.money')}</button><button class="tab" data-v="company">${t('o.company')}</button>`
    : `<button class="tab" data-v="mine">${t('o.my_jobs')}</button>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchView(b.dataset.v));

  if(!isTower) await refreshWallet();
  if(isTower){
    renderVerifyBar();
    renderPushBanner();
    // Read the duty switch straight away — the header must never show a guess
    // about whether this company is currently being offered work.
    api('/company/overview').then(r => {
      if(r && r.success && r.company){ DUTY = Number(r.company.is_available) === 1; renderDuty(); }
    }).catch(() => {});
  }

  startRealtime();

  // A notification tap lands on ?job=<id>; go straight to the board so the job
  // is the first thing on screen rather than whichever tab was last open.
  const jump = new URLSearchParams(location.search).get('tab');
  switchView(isTower ? (jump === 'alerts' ? 'alerts' : 'board') : 'mine');
}

/* ── verification ────────────────────────────────────────────────
   A company that signed up on a phone and never finished uploading cannot take
   a single job, and nothing on the board tells them why. This banner is that
   explanation, and it carries the upload controls so finishing is one tap from
   where they already are rather than a page they have to find. */
async function renderVerifyBar(){
  const status = ME.account.verification_status;
  const box = document.getElementById('notices');

  if(status === 'approved'){
    box.innerHTML = `<div class="verify-bar ok">
      <h4>&#10003; ${t('o.verified_h')}</h4>
      <p>${t('o.verified_p')}</p></div>`;
    return;
  }

  const r = await api('/docs/mine');
  const list = (r.success ? r.checklist : []);
  const missing = list.filter(c => !c.uploaded).length;

  // <details> keeps its open/closed state in the DOM, and this function replaces
  // that DOM wholesale. So uploading a document — which re-renders to show the
  // new tick — collapsed the card the operator was still working in, mid-way
  // through a set of four. Carry the state across the rebuild.
  const prev = box.querySelector('.vdocs-wrap');
  if (prev) VDOCS_OPEN = prev.open;

  box.innerHTML = `<div class="verify-bar">
    <h4>${status === 'pending' ? t('o.review_h') : t('o.unverified_h')}</h4>
    <p>${status === 'pending' ? t('o.review_p')
        : status === 'rejected' ? (r.rejection_reason || t('o.rejected_p'))
        : t('o.unverified_p', {n: missing})}</p>
    ${missing || status === 'rejected' ? `
      <!-- Collapsed unless something was actually rejected. A company that just
           signed up is not asked for four documents before it has seen a single
           job; the platform asks at review, and this is here only for the
           operator who wants to get ahead of it. -->
      <details class="vdocs-wrap" ${status === 'rejected' || VDOCS_OPEN ? 'open' : ''}
               ontoggle="VDOCS_OPEN = this.open">
        <summary>${status === 'rejected' ? t('j.docs_fix') : t('j.docs_upload_now')}</summary>
      <div class="vdocs">
        ${list.map(c => `
          <div class="vrow ${c.uploaded ? 'have' : ''}">
            <div class="vm">${c.uploaded ? '✓' : ''}</div>
            <div class="vi"><b>${c.label}</b><small>${
              c.uploaded ? (c.status === 'rejected' ? t('j.doc_rejected') + (c.notes ? ' — ' + c.notes : '')
                                                     : t('j.doc_received'))
                         : t('j.doc_missing')}</small></div>
            ${c.doc_type.indexOf('coi') === 0
              ? `<input type="date" id="vexp_${c.doc_type}" title="${t('j.doc_expiry')}">` : ''}
            <label class="vbtn">${c.uploaded ? t('j.doc_replace') : t('j.doc_upload')}
              <input type="file" accept=".pdf,.jpg,.jpeg,.png,.heic,.webp" style="display:none"
                     onchange="uploadVerifyDoc('${c.doc_type}', this)">
            </label>
          </div>`).join('')}
      </div>
      </details>` : ''}
  </div>`;
}

async function uploadVerifyDoc(docType, input){
  const file = input.files[0];
  if(!file) return;

  const expEl = document.getElementById('vexp_' + docType);
  if(docType.indexOf('coi') === 0 && expEl && !expEl.value){
    input.value = '';
    return alert(t('j.err_expiry'));
  }

  const fd = new FormData();
  fd.append('doc_type', docType);
  fd.append('file', file);
  if(expEl && expEl.value) fd.append('expires_at', expEl.value);

  // No Content-Type header — the browser must set the multipart boundary.
  const r = await fetch(API + '/docs/upload?lang=' + tlLang(), {
    method:'POST',
    headers:{'Authorization':'Bearer ' + TOKEN, 'X-Auth-Token':TOKEN},
    body:fd
  }).then(x => x.json()).catch(() => ({success:false, error:'Upload failed'}));

  input.value = '';
  if(!r.success) return alert(r.error);

  // The account flips to Pending the moment the last document lands, so the
  // banner has to be re-read rather than patched.
  const me = await api('/auth/me');
  if(me.success) ME = me;
  VDOCS_OPEN = true;          // they are mid-way through a set; do not shut it
  renderVerifyBar();
  // The steps banner is computed from these documents, so it has to be
  // recomputed too. Not via load() — that only refreshes the banner on the
  // board tab, and this upload happens elsewhere.
  refreshVerification();
}

async function refreshWallet(){
  const w = await api('/wallet/balance');
  if(!w.success) return;
  document.getElementById('walletBox').innerHTML =
    `<span class="wallet">Available <b>${money(w.available)}</b>` +
    (Number(w.held) > 0 ? ` &middot; Held <span class="held">${money(w.held)}</span>` : '') + `</span>`;
}


/* ── rate sheet ────────────────────────────────────────────────────
   What this company charges, in its own words. It is never shown to another
   company and there is no endpoint that would let one ask; it exists so a
   market can be priced from what the people working in it actually charge.

   The figure asked for is what they want to RECEIVE. Our cut comes out of the
   customer's total, so the customer price is grossed up on the server — ask
   for "what you charge" and pay them less than that and every job gets
   declined by people who think they were misled.
   ──────────────────────────────────────────────────────────────── */
// ═══ DOCUMENTS ═══════════════════════════════════════════════════════════════
// The same checklist as signup, but this one also has to answer the questions
// an operator asks LATER: has it been looked at, was it rejected and why, and
// when does my insurance run out. Signup only ever had to say "missing".
async function renderDocsPane(){
  const pane = document.getElementById('docsPane');
  if(!pane) return;
  pane.innerHTML = `<div class="empty">${t('o.loading')}</div>`;

  const r = await api('/docs/mine');
  if(!r.success){ pane.innerHTML = `<div class="empty"><p>${esc(r.error||'')}</p></div>`; return; }

  const today = new Date().toISOString().slice(0,10);
  const list  = r.checklist || [];
  const allIn = list.length > 0 && list.every(c => c.uploaded);

  const statusLine = c => {
    if(!c.uploaded) return `<small class="d-miss">${t('d.missing')}</small>`;
    if(c.status === 'rejected')
      return `<small class="d-bad">${t('d.rejected')}${c.notes ? ' — ' + esc(c.notes) : ''}</small>`;
    // An expiry in the past is why a working company suddenly cannot accept a
    // job, and it is invisible unless the date is on the screen.
    if(c.expires_at && c.expires_at < today)
      return `<small class="d-bad">${t('d.expired', {date: fmtDate(c.expires_at)})}</small>`;
    if(c.status === 'approved')
      return `<small class="d-ok">${t('d.approved')}${c.expires_at ? ' · ' + t('d.expires', {date: fmtDate(c.expires_at)}) : ''}</small>`;
    return `<small class="d-pend">${t('d.pending')}</small>`;
  };

  const mark = c => {
    if(!c.uploaded) return '';
    if(c.status === 'rejected' || (c.expires_at && c.expires_at < today)) return '!';
    if(c.status === 'approved') return '✓';
    return '·';
  };

  pane.innerHTML = `
    <div class="pane">
      <div class="pane-h"><h3>${t('d.h')}</h3></div>
      <div class="pane-b">
        <p class="push-fine">${t('d.sub')}</p>
        ${r.rejection_reason ? `<div class="notice warn"><b>${t('d.acct_rejected')}</b> ${esc(r.rejection_reason)}</div>` : ''}
        <div class="docs">
          ${list.map(c => `
            <div class="docrow ${c.uploaded ? 'have' : ''} ${c.status === 'rejected' ? 'bad' : ''}">
              <div class="dmark">${mark(c)}</div>
              <div class="dinfo"><b>${esc(c.label)}</b>${statusLine(c)}</div>
              ${c.doc_type.startsWith('coi')
                ? `<input type="date" class="dexp" id="dexp_${esc(c.doc_type)}"
                          value="${esc(c.expires_at || '')}" title="${t('d.expiry_hint')}">` : ''}
              <label class="dbtn">
                ${c.uploaded ? t('d.replace') : t('d.upload')}
                <input type="file" accept=".pdf,.jpg,.jpeg,.png,.heic,.webp" style="display:none"
                       onchange="uploadMyDoc('${esc(c.doc_type)}', this)">
              </label>
            </div>`).join('')}
        </div>
        <div id="docsMsg" class="push-fine"></div>
        <div class="dstatus ${allIn ? 'go' : ''}">${allIn ? t('d.all_in') : t('d.waiting')}</div>
      </div>
    </div>`;
}

function fmtDate(d){
  try { return new Date(d + 'T00:00:00').toLocaleDateString(tlLang() === 'es' ? 'es-US' : 'en-US',
        {year:'numeric', month:'short', day:'numeric'}); }
  catch(e){ return d; }
}

/* ── duty switch ─────────────────────────────────────────────────
   "Taking jobs" / "Not taking jobs". Off means we do not offer them work —
   no alerts, and they stop counting as coverage for customers nearby. It does
   NOT hide the board or block accepting: someone who flips back on should not
   have to wait for the next alert, and a company that spots a job it wants
   should be able to take it. Not offered and not allowed are different. */
let DUTY = null;

function renderDuty(){
  const btn = document.getElementById('dutyBtn');
  if(!btn) return;
  if(DUTY === null || !ME || ME.account.account_type !== 'tower'){
    btn.classList.add('hide');
    return;
  }
  btn.classList.remove('hide');
  btn.disabled = false;
  btn.className = 'duty ' + (DUTY ? 'on' : 'off');
  btn.innerHTML = `<span class="dot"></span>${t(DUTY ? 'duty.on' : 'duty.off')}`;
  btn.title = t(DUTY ? 'duty.on_hint' : 'duty.off_hint');
}

async function toggleDuty(){
  const btn = document.getElementById('dutyBtn');
  const next = !DUTY;

  // Going off duty is the one direction worth a confirmation — it stops work
  // arriving, and an accidental tap would look like the platform going quiet.
  if(!next && !confirm(t('duty.confirm_off'))) return;

  btn.disabled = true;
  const r = await api('/company/availability', {method:'POST', body: JSON.stringify({available: next})});
  if(!r.success){
    btn.disabled = false;
    toast(r.error || '', true);
    return;
  }
  DUTY = !!r.available;
  renderDuty();
  toast(r.message || '');

  // Coverage and the steps banner both move with this, so re-read rather than
  // assume. A company that just came back on duty should see that reflected.
  refreshVerification();
}

async function doWithdraw(){
  const btn = document.getElementById('wdBtn');
  const msg = document.getElementById('wdMsg');
  if(!confirm(t('m.withdraw_confirm'))) return;

  // Disabled immediately: this moves real money, and a second click while the
  // first request is still in flight is the one thing that must not happen.
  btn.disabled = true;
  msg.textContent = t('m.sending');
  msg.style.color = '';

  const r = await api('/payouts/withdraw', {method:'POST', body:'{}'});
  if(!r.success){
    msg.textContent = r.error || '';
    msg.style.color = 'var(--red)';
    btn.disabled = false;
    return;
  }
  await renderMoneyPane();
  const m2 = document.getElementById('wdMsg');
  if(m2){ m2.textContent = r.message || ''; m2.style.color = 'var(--green)'; }
}

async function connectBank(){
  const msg = document.getElementById('wdMsg');
  if(msg){ msg.textContent = t('m.opening_bank'); msg.style.color = ''; }

  const r = await api('/connect/onboard', {method:'POST', body:'{}'});

  if(!r.success){
    // Never alert() a server error here. This one concatenated Stripe's raw
    // API text, so pressing "Connect my bank" put six lines of developer
    // documentation and three docs.stripe.com URLs in front of a tow truck
    // operator. The server now sends something a person can act on; anything
    // technical stays in the log where it is useful.
    toast(r.error || t('m.bank_failed'), true);
    if(msg){ msg.textContent = r.error || t('m.bank_failed'); msg.style.color = 'var(--red)'; }
    return;
  }

  // The endpoint returns `onboarding_url`. This read `r.url`, which is never
  // set — so the call succeeded, the operator was sent nowhere, and the button
  // looked broken in the one place where looking broken costs us a supplier.
  const url = r.onboarding_url;
  if(!url){
    toast(t('m.bank_failed'), true);
    return;
  }
  location.href = url;
}

  if(c.base_lat === null || c.base_lat === undefined || c.base_lat === '')
    return t('co.base_none');

async function wireBasePicker(){
  const el = document.getElementById('co_base');
  if(!el || typeof TLPlaces === 'undefined') return;
  BASE_PICK = null;

  const ok = await TLPlaces.attach(el, p => {
    BASE_PICK = p;
    const note = document.getElementById('baseNote');
    if(note){
      note.textContent = t('co.base_picked', {addr: p.address});
      note.style.color = 'var(--green)';
    }
  });

  // If suggestions cannot load, say so rather than leaving a box that looks
  // like it works: typing an address here without choosing a suggestion cannot
  // produce coordinates, so it would appear to save and change nothing.
  if(!ok){
    const note = document.getElementById('baseNote');
    if(note) note.textContent = t('co.base_nomaps');
    el.disabled = true;
  }
}

async function sendSupport(){
  const msg = document.getElementById('spMsg');
  const subject = document.getElementById('sp_subject').value.trim();
  const message = document.getElementById('sp_message').value.trim();
  if(!subject || !message){
    msg.textContent = t('sp.need_both'); msg.style.color = 'var(--red)'; return;
  }
  msg.textContent = t('sp.sending'); msg.style.color = '';

  // The email address is filled in server-side from the signed-in account, so
  // a company never has to retype the address we already have for them.
  const r = await api('/support/create', {method:'POST', body: JSON.stringify({subject, message})});
  if(!r.success){ msg.textContent = r.error || ''; msg.style.color = 'var(--red)'; return; }

  document.getElementById('sp_subject').value = '';
  document.getElementById('sp_message').value = '';
  msg.textContent = r.message || '';
  msg.style.color = 'var(--green)';
  loadMyTickets();
}

async function confirmCloseAccount(){

async function saveTruck(id){
  const val = i => (document.getElementById(i)?.value || '').trim();
  const body = {
    id, label: val('tk_label'), truck_type: val('tk_type'), capacity_class: val('tk_class'),
    year: val('tk_year'), make: val('tk_make'), model: val('tk_model'), plate: val('tk_plate'),
    equipment: EQUIP_KEYS.filter(k => document.getElementById('tkeq_' + k)?.checked)
  };
  if(!body.label){ document.getElementById('tkMsg').textContent = t('co.tk_need_label'); return; }

  const r = await api('/company/truck-save', {method:'POST', body: JSON.stringify(body)});
  const msg = document.getElementById('tkMsg');
  if(!r.success){ msg.textContent = r.error || ''; msg.style.color = 'var(--red)'; return; }

  CO.trucks = r.trucks;
  document.getElementById('truckList').innerHTML = trucksHTML(r.trucks);
  document.getElementById('truckForm').innerHTML = '';
  renderCompanyPane();
}

async function deleteTruck(id){
  // Removing a truck is not undoable from this screen, so it asks first and
  // names the one it is about to remove.
  const tk = (CO?.trucks || []).find(x => x.id === id);
  if(!confirm(t('co.tk_confirm', {label: tk ? tk.label : '#' + id}))) return;
  const r = await api('/company/truck-delete', {method:'POST', body: JSON.stringify({id})});
  if(!r.success) return alert(r.error || '');
  CO.trucks = r.trucks;
  renderCompanyPane();
}

  const body = {
    name: val('name'), phone: val('phone'), address: val('address'), city: val('city'),
    state: val('state'), zip: val('zip'), website: val('website'),
    dot_number: val('dot_number'), mc_number: val('mc_number'),
    service_radius_miles: val('service_radius_miles')
  };
  CAPABILITY_KEYS.forEach(k => { body[k] = document.getElementById('co_' + k)?.checked ? 1 : 0; });

  // Only sent when a suggestion was actually chosen. Typed text is an address,
  // not a position, and guessing one here would file the company in the wrong
  // place — which is exactly the bug this field exists to fix.
  if(BASE_PICK){
    body.base_lat = BASE_PICK.lat;
    body.base_lng = BASE_PICK.lng;
    if(!body.city  && BASE_PICK.city)  body.city  = BASE_PICK.city;
    if(!body.state && BASE_PICK.state) body.state = BASE_PICK.state;
    if(!body.zip   && BASE_PICK.zip)   body.zip   = BASE_PICK.zip;
  }

  // Changing the number un-verifies it — the verified value is compared against
  // the current one server-side. Say so before saving rather than letting the
  // green tick quietly turn back into a red step.
  const before = CO?.company?.phone || '';
  if(before && body.phone && normalizeLoose(body.phone) !== normalizeLoose(before)
     && CO?.company?.phone_verified){
    if(!confirm(t('co.phone_reverify'))) return;
  }

  const r = await api('/auth/update-profile', {method:'POST', body: JSON.stringify(body)});

  if(!r.success){
    const msg = document.getElementById('coMsg');
    msg.textContent = r.error || '';
    msg.style.color = 'var(--red)';
    return;
  }

  // The confirmation has to be written AFTER the redraw, not before it.
  // renderCompanyPane() replaces this pane wholesale — including #coMsg — so
  // setting the text first meant "Saved." was destroyed a moment later and the
  // save looked like it had done nothing at all.
  const me = await api('/auth/me');
  if(me.success) ME = me;
  await renderCompanyPane();

  const msg = document.getElementById('coMsg');
  if(msg){ msg.textContent = t('co.saved'); msg.style.color = 'var(--green)'; }
}

const normalizeLoose = s => String(s||'').replace(/\D+/g, '');

async function sendCode(channel){
  const msg = document.getElementById('vcmsg_' + channel);
  msg.textContent = t('co.sending');
  msg.style.color = '';
  const r = await api('/verify/send', {method:'POST', body: JSON.stringify({channel})});
  msg.textContent = r.success ? (r.message || '') + (r.sent_to ? ' (' + r.sent_to + ')' : '') : (r.error || '');
  msg.style.color = r.success ? 'var(--green)' : 'var(--red)';
}

async function confirmCode(channel){
  const msg = document.getElementById('vcmsg_' + channel);
  const code = document.getElementById('vc_' + channel)?.value?.trim();
  if(!code){ msg.textContent = t('co.enter_code'); msg.style.color = 'var(--red)'; return; }

  const r = await api('/verify/confirm', {method:'POST', body: JSON.stringify({channel, code})});
  if(!r.success){ msg.textContent = r.error || ''; msg.style.color = 'var(--red)'; return; }

  toast(t(channel === 'email' ? 'co.email_confirmed_ok' : 'co.phone_confirmed_ok'));

  // Two separate things have to catch up, and only one of them is on screen.
  //
  // The panel below is easy — it is re-read here. The steps banner at the top
  // of every page is the one that used to go stale: renderNotices() is only
  // called from load(), and load() only refreshes it when the BOARD tab is
  // open. Confirming happens on the company tab, so the banner kept saying
  // "Confirm your phone number" with a red ! until the page was reloaded.
  await renderCompanyPane();
  await refreshVerification();
}

/**
 * Redraw the steps banner from the server's own answer, whichever tab is open.
 * Deliberately not routed through load() — that fetches a job list, which has
 * nothing to do with whether a phone number is confirmed, and does not run at
 * all on four of the seven tabs.
 */
async function refreshVerification(){
  const box = document.getElementById('notices');
  if(!box) return;
  const r = await api('/verify/status');
  if(!r.success || !r.steps) return;

  box.innerHTML = r.steps.ok ? '' : verifyStepsHTML(r.steps);
}

/* A short-lived confirmation, anchored to the document rather than to any pane.
   Everything inside <main> gets replaced wholesale by a re-render, so a message
   written in there is destroyed by the very redraw that follows the action it
   was confirming. */
function toast(text, bad){
  let host = document.getElementById('toastHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'toastHost';
    host.className = 'toasts';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.className = 'toast ' + (bad ? 'bad' : 'ok');
  el.textContent = text;
  host.appendChild(el);
  setTimeout(() => el.remove(), bad ? 8000 : 4500);
}

async function uploadMyDoc(docType, input){
  const file = input.files[0];
  if(!file) return;
  const msg = document.getElementById('docsMsg');
  msg.textContent = '';

  const expEl = document.getElementById('dexp_' + docType);
  if(docType.startsWith('coi') && expEl && !expEl.value){
    input.value = '';
    msg.innerHTML = `<span class="d-bad">${t('d.err_expiry')}</span>`;
    return;
  }

  const fd = new FormData();
  fd.append('doc_type', docType);
  fd.append('file', file);
  if(expEl && expEl.value) fd.append('expires_at', expEl.value);

  msg.textContent = t('d.uploading');
  // No Content-Type header on purpose — the browser must set the multipart
  // boundary itself, and setting it by hand silently breaks the upload.
  const r = await fetch(API + '/docs/upload?lang=' + tlLang(), {
    method:'POST',
    headers:{'Authorization':'Bearer ' + TOKEN, 'X-Auth-Token':TOKEN},
    body:fd
  }).then(x => x.json()).catch(() => ({success:false, error:t('d.err_upload')}));

  input.value = '';
  if(!r.success){ msg.innerHTML = `<span class="d-bad">${esc(r.error||'')}</span>`; return; }

  // Re-read rather than patch the row: the server decides the new status, and
  // uploading a replacement can reset an approved document to pending.
  renderDocsPane();
  // Same as above: the banner is derived from these documents and must be
  // re-read whichever tab we are on.
  refreshVerification();
}

    document.getElementById('viewSub').textContent = '';
    f.innerHTML = '';
    list.classList.add('hide');
    pane.classList.add('hide');
    rpane.classList.add('hide');
    dpane.classList.add('hide');
    cpane.classList.remove('hide');
    renderCompanyPane();
    return;
  }
  cpane.classList.add('hide');

  // Documents. This screen did not exist: the only place a company could ever
  // upload its paperwork was the signup page, immediately after registering.
  // Anyone who skipped it, or whose insurance later expired, was told "cannot

    rpane.classList.remove('hide');

  }

    document.getElementById('pushBanner').innerHTML = '';
    document.getElementById('viewTitle').textContent = t('o.alerts');
    document.getElementById('viewSub').textContent = '';
    f.innerHTML = '';
    list.classList.add('hide');
    pane.classList.remove('hide');
    renderAlertsPane();
    return;
  }
  pane.classList.add('hide');
  list.classList.remove('hide');

      <select id="fService" onchange="load()">

    document.getElementById('viewTitle').textContent = t('o.my_jobs');

async function load(){
  const list = document.getElementById('list');
  list.innerHTML = `<div class="empty">Loading…</div>`;
  let res;

  if(VIEW === 'board'){
    const s = document.getElementById('fService')?.value || '';
    const r = document.getElementById('fRadius')?.value || 35;
    res = await api(`/calls/board?radius=${r}` + (s ? `&service_type=${s}` : ''));
    renderNotices(res);
  } else if(VIEW === 'mine'){
    // Live work only. A finished job leaving this screen is the point of it —
    // it is the list of what still needs doing.
    res = await api('/calls/my-calls?status=active&limit=100');
  } else if(VIEW === 'history'){
    const p = new URLSearchParams({status: 'closed', limit: '200'});
    const q  = document.getElementById('hQ')?.value.trim();
    const st = document.getElementById('hStatus')?.value;
    const f  = document.getElementById('hFrom')?.value;
    const to = document.getElementById('hTo')?.value;
    if(q)  p.set('q', q);
    // The status box narrows within closed jobs; empty means all of them.
    if(st) p.set('status', st);
    if(f)  p.set('from', f);
    if(to) p.set('to', to);
    res = await api('/calls/my-calls?' + p.toString());
  } else {
    res = await api('/bids/mine');
    return renderBids(res.bids || []);
  }

  if(!res.success){ list.innerHTML = `<div class="notice err">${res.error}</div>`; return; }
  DATA = res.calls || [];
  // Location sharing follows the job list: it starts when a live job appears
  // and stops on its own when there isn't one.
  if(typeof syncDriverSharing === 'function') syncDriverSharing();
  document.getElementById('viewSub').textContent =
    (VIEW === 'board' && res.search)
      ? t(DATA.length === 1 ? 'o.job_within' : 'o.jobs_within', {n: DATA.length, r: res.search.radius_miles})
      : DATA.length + ' ' + t('c.jobs');

  renderHistoryTotals(VIEW === 'history' ? res.totals : null, DATA.length);

  if(VIEW === 'history' && !DATA.length){
    document.getElementById('list').innerHTML =
      `<div class="empty"><h3>${t('o.hist_none')}</h3><p>${t('o.hist_none_sub')}</p></div>`;
    return;
  }
  render();
}

function renderNotices(res){
  const n = document.getElementById('notices');
  if(!res.verification || res.verification.ok){ n.innerHTML = ''; return; }
  n.innerHTML = verifyStepsHTML(res.verification);
}

/* The three things between a company and its first job, as a checklist.
   Built as one component because the board, the documents tab and the company
   page all have to show the same state — three hand-written copies of it is how
   two screens end up telling an operator different things about whether they
   can work. */
function verifyStepsHTML(v){
  // Everything uploaded and waiting on a human is NOT an error, and must not be
  // dressed as one. This was the whole complaint: a company that had done all
  // four uploads still got a red "cannot accept jobs" naming a missing
  // certificate, because the only question ever asked was "is one APPROVED?".
  const waiting = v.waiting === true;

  const rows = v.steps.map(s => {
    const mark = s.done ? '✓' : (s.state === 'pending' ? '•' : '!');
    const cls  = s.done ? 'done' : (s.state === 'pending' ? 'wait' : 'todo');
    // Only offer an action for the step the operator can actually act on.
    const act  = s.done || s.state === 'pending' ? ''
      : s.key === 'documents'
        ? `<a href="#" class="vs-go" onclick="switchView('docs');return false">${t('v.go_docs')}</a>`
        : `<a href="#" class="vs-go" onclick="switchView('company');return false">${t('v.go_verify')}</a>`;
    return `<div class="vs-row ${cls}">
        <span class="vs-mark">${mark}</span>
        <span class="vs-text"><b>${s.label}</b><small>${s.detail}</small></span>
        ${act}
      </div>`;
  }).join('');

  return `<div class="verify-steps ${waiting ? 'waiting' : 'blocked'}">
      <h4>${waiting ? t('v.head_waiting') : t('v.head_blocked')}</h4>
      <p class="vs-sub">${waiting ? t('v.sub_waiting') : t('v.sub_blocked')}</p>
      <div class="vs-rows">${rows}</div>
    </div>`;
}

  if(el.open) OPEN_BREAKDOWNS.add(id); else OPEN_BREAKDOWNS.delete(id);

// Rewrite only the countdown text and its urgency colour. The deadline was
// frozen at render time from the server's own expires_in_sec — deriving it from
// the timestamp here would read a UTC value as local time and show 0:00 on a
// job with twenty minutes left.
function tickTimers(){
  if(!ME) return;
  document.querySelectorAll('.timer[data-deadline]').forEach(el => {
    const secs = Math.max(0, (Number(el.dataset.deadline) - Date.now())/1000);
    const t = el.querySelector('.t');
    if(t) t.textContent = Math.floor(secs/60) + ':' + String(Math.floor(secs%60)).padStart(2,'0');
    el.classList.toggle('crit', secs < 300);
    el.classList.toggle('warn', secs >= 300 && secs < 600);
    const card = el.closest('.call');
    if(card) card.classList.toggle('urgent', secs < 300);
  });
}

          <span>${c.customer_name || ''}</span>

          ${flags.length ? `<span class="flag">${flags.join(' &middot; ')}</span>` : ''}
        </div>

        ${isTower && c.photo_state ? photoPanel(c) : ''}

        ${isTower && c.lines && c.lines.length ? `
        <details class="bd" data-call="${c.id}" ${OPEN_BREAKDOWNS.has(String(c.id)) ? 'open' : ''}
                 ontoggle="rememberBreakdown(this)">
          <summary>${t('o.breakdown')}</summary>
          ${c.lines.map(l => `<div class="bl"><span>${l.label}</span><b>${money(l.amount)}</b></div>`).join('')}
          <div class="bl tot"><span>${t('o.job_total')}</span><b>${money(c.offer_amount)}</b></div>
          <div class="bl fee"><span>${t('o.platform_fee')}</span><b>&minus;${money(c.platform_fee_estimate)}</b></div>
          <div class="bl net"><span>${t('o.you_get')}</span><b>${money(net)}</b></div>
        </details>` : ''}
      </div>
      <div class="c-side">
        ${c.distance_miles != null ? `<div class="dist">${c.distance_miles}<br><span style="color:var(--ink-faint);font-weight:400">${t('o.miles')}</span></div>` : ''}
        ${open ? `<div class="timer ${tcls}" data-deadline="${Date.now() + secs * 1000}"><div class="t">${mins}:${ss}</div><div class="l">${t('o.left')}</div></div>` : ''}
        <div class="pay">
          <div class="amt">${money(c.offer_amount)}</div>
          ${isTower ? `<div class="net">${money(net)} ${t('o.to_you')}</div>` : ''}
          ${c.pricing_mode === 'bid' ? `<div class="mode">Bidding &middot; ${c.bid_count||0}</div>` : ''}
        </div>
        <div class="act">
          ${isTower && open
            ? (c.pricing_mode === 'bid'
                ? `<button class="btn ${c.already_bid?'ghost':'go'}" onclick="openAct(${c.id},'bid')">${c.already_bid?'Update bid':'Place bid'}</button>`
                : `<button class="btn go" onclick="openAct(${c.id},'accept')">${t('o.accept')}</button>`)
            : ''}
          ${isTower && !open && ['awarded','en_route','on_scene','in_progress'].includes(c.status)
            ? `<button class="btn green" onclick="advance(${c.id},'${c.status}','${c.service_type}')">${nextLabel(c.status, c.service_type)}</button>` : ''}
          <!-- Gone on arrival. Offered once the driver is actually out — there
               is nothing to be gone from before he has set off. Not offered
               once the car is on the truck, because at that point it plainly
               was there. -->
          ${isTower && ['en_route','on_scene'].includes(c.status)
            ? `<button class="btn ghost" onclick="claimGOA(${c.id})">${t('o.goa')}</button>` : ''}
          ${!isTower && open ? `<button class="btn ghost" onclick="cancelCall(${c.id})">${t('o.cancel')}</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderBids(bids){
  document.getElementById('viewSub').textContent = bids.length + ' bids';
  const list = document.getElementById('list');
  if(!bids.length){ list.innerHTML = `<div class="empty"><h3>No bids yet</h3></div>`; return; }
  list.innerHTML = bids.map(b => `<div class="call">
